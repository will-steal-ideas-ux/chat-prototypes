<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexos.ai — Chat Folders</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    :root {
      --bg-primary:     #f5f5f5;
      --bg-secondary:   #ffffff;
      --bg-tertiary:    #f2f2f3;
      --text-primary:   #252429;
      --text-secondary: #44434b;
      --text-tertiary:  #6f6e78;
      --text-disabled:  #949399;
      --border:         rgba(124,123,132,0.15);
      --border-md:      rgba(124,123,132,0.25);
      --brand:          #693bff;
      --brand-bg:       rgba(140,117,255,0.10);
      --brand-bg-hover: rgba(140,117,255,0.16);
      --hover-bg:       rgba(124,123,132,0.08);
      --active-bg:      rgba(124,123,132,0.12);
      --folder-line:    rgba(124,123,132,0.22);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ══ Sidebar ════════════════════════════════════════════ */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--bg-primary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      padding: 14px 12px 10px 16px;
      gap: 8px;
      flex-shrink: 0;
    }

    .logo-wrap { flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 4px; }
    .logo-text { font-size: 14px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.02em; }

    .icon-btn {
      width: 30px; height: 30px; border-radius: 6px; border: none;
      background: transparent; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      color: var(--text-tertiary); transition: background 0.12s; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--hover-bg); color: var(--text-primary); }

    /* Top nav */
    .sidebar-nav { padding: 0 8px 4px; flex-shrink: 0; }

    .nav-link {
      display: flex; align-items: center; gap: 8px; height: 32px;
      padding: 4px 8px 4px 12px; border-radius: 8px; border: none;
      background: transparent; cursor: pointer; font-size: 14px; font-weight: 400;
      color: var(--text-secondary); width: 100%; text-align: left;
      transition: background 0.1s; font-family: 'Inter', sans-serif;
    }
    .nav-link:hover { background: var(--hover-bg); }
    .nav-link.new-chat { background: var(--brand-bg); }
    .nav-link.new-chat:hover { background: var(--brand-bg-hover); }
    .nav-link.new-chat .nl-icon { color: var(--brand); }
    .nl-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-tertiary); }
    .nl-label { flex: 1; }
    .nl-shortcut { font-size: 13px; color: var(--text-disabled); display: none; }
    .nav-link.new-chat:hover .nl-shortcut { display: inline; }

    .sidebar-sep { height: 1px; background: var(--border); margin: 6px 8px; flex-shrink: 0; }

    /* Scrollable */
    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 4px 8px 8px; min-height: 0; }
    .sidebar-scroll::-webkit-scrollbar { width: 3px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(124,123,132,0.25); border-radius: 3px; }

    /* Section header row */
    .section-head {
      display: flex; align-items: center; height: 28px;
      padding: 4px 6px 4px 12px; border-radius: 8px; cursor: default;
      margin-bottom: 2px; user-select: none;
    }

    .section-head-left { display: flex; align-items: center; gap: 6px; flex: 1; }

    .section-label {
      font-size: 11px; font-weight: 600; color: var(--text-disabled);
      letter-spacing: 0.05em; text-transform: uppercase;
    }

    .section-add-btn {
      width: 20px; height: 20px; border-radius: 4px; border: none;
      background: transparent; cursor: pointer; display: flex;
      align-items: center; justify-content: center; color: var(--text-disabled);
      transition: background 0.1s, color 0.1s; flex-shrink: 0;
    }
    .section-add-btn:hover { background: var(--hover-bg); color: var(--text-secondary); }

    /* ── Folder items ── */
    .folder-item { margin-bottom: 1px; }

    .folder-header {
      display: flex; align-items: center; height: 32px;
      padding: 4px 4px 4px 12px; border-radius: 8px;
      cursor: pointer; position: relative; transition: background 0.1s;
      user-select: none;
    }
    .folder-header:hover { background: var(--hover-bg); }

    .folder-icon {
      width: 16px; height: 16px; flex-shrink: 0; margin-right: 5px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-tertiary); position: relative;
    }

    /* Folder icon swaps to chevron on hover */
    .fi-folder { display: flex; }
    .fi-chevron { display: none; align-items: center; justify-content: center; }
    .fi-chevron svg { transition: transform 0.15s; }

    .folder-header:hover .fi-folder { display: none; }
    .folder-header:hover .fi-chevron { display: flex; }

    /* Chevron points right when collapsed, down when expanded */
    .folder-item:not(.expanded) .fi-chevron svg { transform: rotate(-90deg); }
    .folder-item.expanded .fi-chevron svg { transform: rotate(0deg); }

    .folder-name {
      flex: 1; font-size: 14px; font-weight: 500; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .folder-name-input {
      flex: 1; height: 22px; padding: 0 6px;
      border: 1px solid var(--brand); border-radius: 4px;
      font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
      color: var(--text-primary); background: var(--bg-secondary); outline: none;
      box-shadow: 0 0 0 2px rgba(105,59,255,0.15);
    }

    .folder-actions {
      display: flex; align-items: center; gap: 1px;
      flex-shrink: 0; opacity: 0; transition: opacity 0.1s;
    }
    .folder-header:hover .folder-actions { opacity: 1; }
    .folder-header.menu-open .folder-actions { opacity: 1; }

    .folder-action-btn {
      width: 24px; height: 24px; border-radius: 4px; border: none;
      background: transparent; cursor: pointer; display: flex;
      align-items: center; justify-content: center; color: var(--text-tertiary);
      transition: background 0.1s, color 0.1s;
    }
    .folder-action-btn:hover { background: rgba(124,123,132,0.12); color: var(--text-primary); }

    /* Folder body */
    .folder-body {
      display: none; padding-left: 14px; position: relative;
    }
    .folder-item.expanded .folder-body { display: block; }

    .folder-body::before {
      content: ''; position: absolute; left: 20px;
      top: 0; bottom: 4px; width: 1px; background: var(--folder-line);
    }

    .folder-chat-item {
      display: flex; align-items: center; height: 32px;
      padding: 4px 4px 4px 14px; border-radius: 8px;
      cursor: pointer; font-size: 14px; color: var(--text-secondary);
      transition: background 0.1s;
    }
    .folder-chat-item:hover { background: var(--hover-bg); }
    .folder-chat-item.active { background: #8c75ff1a; color: var(--text-primary); font-weight: 500; }
    .folder-chat-item.dragging { opacity: 0.35; }

    .folder-chat-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .row-menu-btn {
      width: 20px; height: 20px; border-radius: 3px; border: none;
      background: transparent; cursor: pointer; display: flex;
      align-items: center; justify-content: center; color: var(--text-tertiary);
      opacity: 0; transition: opacity 0.1s, background 0.1s; flex-shrink: 0;
    }
    .folder-chat-item:hover .row-menu-btn,
    .chat-item:hover .row-menu-btn { opacity: 1; }
    .row-menu-btn:hover { background: rgba(124,123,132,0.15); color: var(--text-primary); }
    .row-menu-btn.active { opacity: 1; }

    /* Empty folder */
    .folder-empty {
      padding: 5px 0 5px 14px; font-size: 12px;
      color: var(--text-disabled); font-style: italic;
    }

    /* Drop targets */
    .folder-header.drop-target {
      background: var(--brand-bg) !important;
      outline: 2px solid var(--brand); outline-offset: -2px;
    }
    .recent-drop-zone.drop-target { outline: 2px dashed var(--border-md); outline-offset: 2px; border-radius: 8px; }

    /* New folder CTA */
    .new-folder-btn {
      display: flex; align-items: center; gap: 8px; height: 32px;
      padding: 4px 8px 4px 12px; border-radius: 8px; border: none;
      background: transparent; cursor: pointer; font-size: 14px;
      font-weight: 400; color: var(--text-disabled); width: 100%;
      text-align: left; font-family: 'Inter', sans-serif;
      transition: background 0.1s, color 0.1s; margin-top: 2px;
    }
    .new-folder-btn:hover { background: var(--hover-bg); color: var(--text-secondary); }

    /* Recent chats */
    .recent-section { padding-top: 4px; }

    .chat-item {
      display: flex; align-items: center; height: 32px;
      padding: 4px 4px 4px 12px; border-radius: 8px;
      cursor: pointer; font-size: 14px; color: var(--text-secondary);
      transition: background 0.1s; user-select: none;
    }
    .chat-item:hover { background: var(--hover-bg); }
    .chat-item.active { background: #8c75ff1a; color: var(--text-primary); font-weight: 500; }
    .chat-item.dragging { opacity: 0.35; }

    .chat-item-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Footer */
    .sidebar-footer {
      flex-shrink: 0; padding: 8px 8px 12px; border-top: 1px solid var(--border);
    }
    .account-row {
      display: flex; align-items: center; gap: 8px; height: 32px;
      padding: 4px 8px 4px 12px; border-radius: 8px; cursor: pointer;
      transition: background 0.1s;
    }
    .account-row:hover { background: var(--hover-bg); }
    .avatar {
      width: 20px; height: 20px; border-radius: 50%; background: var(--brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 600; color: white; flex-shrink: 0;
    }
    .account-email { font-size: 14px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ══ Main area ══════════════════════════════════════════ */
    .main {
      flex: 1; display: flex; flex-direction: column; height: 100vh;
      background: var(--bg-secondary);
    }
    .main-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px;
    }
    .main-empty-icon { opacity: 0.4; }
    .main-empty p { font-size: 14px; color: var(--text-disabled); }

    /* ── Topbar ── */
    .chat-topbar {
      height: 48px; min-height: 48px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 20px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .chat-topbar-title {
      font-size: 14px; font-weight: 500; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 480px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 4px; }
    .tb-btn {
      width: 30px; height: 30px; border-radius: 6px; border: none;
      background: transparent; cursor: pointer; display: flex;
      align-items: center; justify-content: center; color: var(--text-tertiary);
      transition: background 0.1s;
    }
    .tb-btn:hover { background: var(--hover-bg); color: var(--text-primary); }

    /* ── Messages ── */
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 32px 0 0;
      display: flex; flex-direction: column;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 4px; }

    .msg-wrap { max-width: 720px; width: 100%; margin: 0 auto; padding: 0 32px; }

    .msg-user { display: flex; justify-content: flex-end; margin-bottom: 20px; }
    .msg-user-bubble {
      background: var(--bg-tertiary); border-radius: 16px 16px 4px 16px;
      padding: 10px 14px; max-width: 520px; font-size: 14px; line-height: 1.6;
      color: var(--text-primary);
    }

    .msg-ai { margin-bottom: 24px; }
    .msg-ai-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .ai-avatar {
      width: 22px; height: 22px; border-radius: 50%; background: var(--bg-tertiary);
      border: 1px solid var(--border-md); display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .ai-name { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
    .msg-ai-body { font-size: 14px; line-height: 1.65; color: var(--text-primary); }
    .msg-ai-body p { margin-bottom: 10px; }
    .msg-ai-body p:last-child { margin-bottom: 0; }
    .msg-ai-body h4 { font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
    .msg-ai-body ul { padding-left: 18px; display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .msg-ai-body li { color: var(--text-secondary); }
    .msg-ai-body li strong { color: var(--text-primary); }

    .msg-actions { display: flex; gap: 2px; margin-top: 8px; }
    .msg-action-btn {
      width: 26px; height: 26px; border-radius: 5px; border: none;
      background: transparent; cursor: pointer; display: flex;
      align-items: center; justify-content: center; color: var(--text-disabled);
      transition: background 0.1s, color 0.1s;
    }
    .msg-action-btn:hover { background: var(--bg-tertiary); color: var(--text-secondary); }

    /* ── Composer ── */
    .chat-composer {
      flex-shrink: 0; padding: 0 32px 20px; position: relative;
    }
    .composer-gradient {
      height: 48px; background: linear-gradient(to bottom, transparent, var(--bg-secondary));
      pointer-events: none; margin-bottom: -2px;
    }
    .composer-card {
      background: #fff; border: 1px solid var(--border-md); border-radius: 14px;
      box-shadow: 0 6px 16px rgba(18,0,69,0.06), 0 2px 6px rgba(18,0,69,0.03);
      padding: 12px 12px 10px; max-width: 720px; margin: 0 auto;
    }
    .composer-input {
      width: 100%; border: none; outline: none; background: transparent; resize: none;
      font-family: 'Inter', sans-serif; font-size: 15px; color: var(--text-primary);
      line-height: 1.55; min-height: 24px; max-height: 140px;
    }
    .composer-input::placeholder { color: #6f6e78; }
    .composer-toolbar {
      display: flex; align-items: center; height: 36px; margin-top: 6px;
    }
    .composer-left { display: flex; align-items: center; gap: 2px; }
    .composer-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
    .c-btn {
      display: flex; align-items: center; gap: 4px; height: 34px; padding: 0 8px;
      border-radius: 6px; border: none; background: transparent; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      font-family: 'Inter', sans-serif; transition: background 0.1s;
    }
    .c-btn:hover { background: var(--bg-tertiary); }
    .send-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: var(--brand); cursor: pointer; display: flex;
      align-items: center; justify-content: center; color: white;
      transition: background 0.1s;
    }
    .send-btn:hover { background: #4700cf; }

    /* ══ Dropdown ════════════════════════════════════════════ */
    .dropdown {
      position: fixed; background: var(--bg-secondary);
      border: 1px solid var(--border-md); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(18,0,69,0.13), 0 2px 8px rgba(18,0,69,0.06);
      padding: 4px; z-index: 900; min-width: 188px;
    }

    .dd-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 10px;
      border-radius: 7px; cursor: pointer; font-size: 14px; color: var(--text-primary);
      transition: background 0.1s; white-space: nowrap; position: relative;
    }
    .dd-item:hover { background: var(--hover-bg); }
    .dd-item.danger { color: #c0392b; }
    .dd-item.danger:hover { background: rgba(192,57,43,0.08); }
    .dd-item.disabled { color: var(--text-disabled); pointer-events: none; }

    .dd-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-tertiary); }
    .dd-item.danger .dd-icon { color: #c0392b; }
    .dd-arrow { margin-left: auto; color: var(--text-disabled); }
    .dd-check { margin-left: auto; color: var(--brand); }

    .dd-sep { height: 1px; background: var(--border); margin: 3px 0; }

    .dd-folder-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-tertiary); }

    /* ══ Modal ═══════════════════════════════════════════════ */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.28);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
    }
    .modal {
      background: var(--bg-secondary); border-radius: 14px;
      box-shadow: 0 20px 60px rgba(18,0,69,0.20), 0 4px 16px rgba(18,0,69,0.10);
      width: 400px; max-width: calc(100vw - 32px);
      padding: 24px; display: flex; flex-direction: column; gap: 20px;
    }
    .modal-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
    .modal-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.55; margin-top: -12px; }

    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
    .form-input {
      width: 100%; height: 38px; padding: 0 12px;
      border: 1px solid var(--border-md); border-radius: 8px;
      font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-primary);
      background: var(--bg-secondary); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(105,59,255,0.12); }
    .form-input.has-error { border-color: #e53e3e; }
    .form-error { font-size: 12px; color: #e53e3e; }

    .modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

    .btn {
      height: 36px; padding: 0 16px; border-radius: 8px;
      font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; transition: background 0.1s;
    }
    .btn-ghost { background: var(--bg-tertiary); color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--hover-bg); }
    .btn-primary { background: var(--brand); color: white; }
    .btn-primary:hover { background: #4700cf; }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }
    .btn-danger { background: #e53e3e; color: white; }
    .btn-danger:hover { background: #c0392b; }

    /* ══ Toast ═══════════════════════════════════════════════ */
    .toast-wrap {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 2000; display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .toast {
      background: #1e1c22; color: white; border-radius: 8px;
      padding: 10px 16px; font-size: 13px; font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.22); animation: toastIn 0.2s ease;
      white-space: nowrap;
    }

    /* ══ Drag ghost ══════════════════════════════════════════ */
    .drag-ghost {
      position: fixed; pointer-events: none; z-index: 4000;
      background: var(--bg-secondary); border: 1px solid var(--border-md);
      border-radius: 8px; padding: 7px 12px; font-size: 13px;
      color: var(--text-primary); box-shadow: 0 8px 24px rgba(18,0,69,0.18);
      max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ══ Demo panel ══════════════════════════════════════════ */
    .demo-panel {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--bg-secondary); border: 1px solid var(--border-md);
      border-radius: 10px; box-shadow: 0 4px 16px rgba(18,0,69,0.10);
      padding: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 100;
    }
    .demo-head { font-size: 10px; font-weight: 600; color: var(--text-disabled); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
    .demo-btn {
      padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-tertiary); font-size: 12px; font-weight: 500;
      color: var(--text-secondary); cursor: pointer; text-align: left;
      transition: background 0.1s; font-family: 'Inter', sans-serif;
    }
    .demo-btn:hover { background: var(--hover-bg); color: var(--text-primary); }

    /* Folder reorder highlight */
    .folder-item.folder-drag-over-above { border-top: 2px solid var(--brand); border-radius: 0; }
    .folder-item.folder-drag-over-below { border-bottom: 2px solid var(--brand); border-radius: 0; }
  </style>
</head>

<script>
// ════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════
let nextId = 100;
const uid = () => `id${nextId++}`;

let state = {
  folders: [
    { id:'f1', name:'Work', expanded: true,  chats:['c1','c2','c3'] },
    { id:'f2', name:'Launch Planning', expanded: false, chats:['c4'] },
    { id:'f3', name:'Starred', expanded: false, chats:[] },
  ],
  chats: {
    c1: 'Cybersecurity market trends for 2026',
    c2: 'PPC budget allocation for Q4',
    c3: 'Landing page headline ideas',
    c4: 'Product launch press release',
    c5: 'EV Market Trends Analysis',
    c6: 'Generate an image bursting out of the page',
    c7: 'Target Audience Brainstorming',
    c8: 'Q3 Competitor Landscape Report',
    c9: 'Onboarding flow copy review',
    c10:'B2B email sequence draft',
    c11:'UX audit of checkout flow',
    c12:'Social media content calendar',
  },
  recentChats: ['c5','c6','c7','c8','c9','c10','c11','c12'],
  activeChat: null,
};

// Modal editing state
let editingFolderId = null;
let deletingFolderId = null;

// ════════════════════════════════════════════════════════════
// Render
// ════════════════════════════════════════════════════════════
function render() {
  renderFolders();
  renderRecent();
}

function renderFolders() {
  const list = document.getElementById('folderList');
  list.innerHTML = '';
  state.folders.forEach(f => {
    list.appendChild(buildFolderEl(f));
  });
}

function buildFolderEl(folder) {
  const item = document.createElement('div');
  item.className = 'folder-item' + (folder.expanded ? ' expanded' : '');
  item.dataset.fid = folder.id;

  // Header
  const header = document.createElement('div');
  header.className = 'folder-header';
  header.dataset.fid = folder.id;
  header.innerHTML = `
    <span class="folder-icon">
      <span class="fi-folder">${folderSvg(14)}</span>
      <span class="fi-chevron">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </span>
    <span class="folder-name" id="fname-${folder.id}">${esc(folder.name)}</span>
    <span class="folder-actions">
      <button class="folder-action-btn" title="New chat in folder" onclick="newChatInFolder('${folder.id}',event)">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 2v8M2 6h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="folder-action-btn" title="Folder options" onclick="openFolderMenu('${folder.id}',event)">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="2.5" r="0.9" fill="currentColor"/><circle cx="6" cy="6" r="0.9" fill="currentColor"/><circle cx="6" cy="9.5" r="0.9" fill="currentColor"/></svg>
      </button>
    </span>
  `;

  header.addEventListener('click', (e) => {
    if (e.target.closest('.folder-action-btn')) return;
    if (e.target.closest('.folder-name-input')) return;
    toggleFolder(folder.id);
  });

  // Drag-over for chats
  header.addEventListener('dragover', (e) => {
    if (dragState.type === 'chat') {
      e.preventDefault();
      clearDropTargets();
      header.classList.add('drop-target');
    }
  });
  header.addEventListener('drop', (e) => {
    if (dragState.type === 'chat') {
      e.preventDefault();
      moveChatToFolder(dragState.chatId, folder.id);
      clearDropTargets();
      endDrag();
    }
  });

  // Drag folder reorder
  if (state.folders.length > 1) {
    item.setAttribute('draggable', 'true');
    item.addEventListener('dragstart', (e) => {
      if (e.target.closest('.folder-action-btn')) { e.preventDefault(); return; }
      startFolderDrag(folder.id, e);
    });
    item.addEventListener('dragend', endDrag);
    item.addEventListener('dragover', (e) => {
      if (dragState.type === 'folder' && dragState.folderId !== folder.id) {
        e.preventDefault();
        clearDropTargets();
        item.classList.add('folder-drag-over-below');
      }
    });
    item.addEventListener('drop', (e) => {
      if (dragState.type === 'folder') {
        e.preventDefault();
        reorderFolder(dragState.folderId, folder.id);
        clearDropTargets();
        endDrag();
      }
    });
  }

  // Body
  const body = document.createElement('div');
  body.className = 'folder-body';

  if (folder.chats.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'folder-empty';
    empty.textContent = 'No chats yet';
    body.appendChild(empty);
  } else {
    folder.chats.forEach(cid => {
      const chatEl = buildFolderChatEl(cid, folder.id);
      body.appendChild(chatEl);
    });
  }

  // Body also a drop target
  body.addEventListener('dragover', (e) => {
    if (dragState.type === 'chat') { e.preventDefault(); header.classList.add('drop-target'); }
  });
  body.addEventListener('drop', (e) => {
    if (dragState.type === 'chat') {
      e.preventDefault();
      moveChatToFolder(dragState.chatId, folder.id);
      clearDropTargets();
      endDrag();
    }
  });

  item.appendChild(header);
  item.appendChild(body);
  return item;
}

function buildFolderChatEl(cid, folderId) {
  const el = document.createElement('div');
  el.className = 'folder-chat-item' + (state.activeChat === cid ? ' active' : '');
  el.dataset.cid = cid;
  el.setAttribute('draggable', 'true');
  el.innerHTML = `
    <span class="folder-chat-label">${esc(state.chats[cid] || 'Unknown chat')}</span>
    <button class="row-menu-btn" title="Options" onclick="openChatMenu('${cid}','${folderId}',event)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="2.5" r="0.85" fill="currentColor"/><circle cx="6" cy="6" r="0.85" fill="currentColor"/><circle cx="6" cy="9.5" r="0.85" fill="currentColor"/></svg>
    </button>
  `;
  el.addEventListener('click', (e) => {
    if (e.target.closest('.row-menu-btn')) return;
    setActiveChat(cid);
  });
  el.addEventListener('dragstart', (e) => startChatDrag(cid, folderId, e));
  el.addEventListener('dragend', endDrag);
  return el;
}

function renderRecent() {
  const list = document.getElementById('recentList');
  list.innerHTML = '';
  state.recentChats.forEach(cid => {
    const el = buildChatEl(cid);
    list.appendChild(el);
  });

  // Show/hide "Recent chats" section header
  document.getElementById('recentSection').style.display =
    state.recentChats.length === 0 ? 'none' : 'block';
}

function buildChatEl(cid) {
  const el = document.createElement('div');
  el.className = 'chat-item' + (state.activeChat === cid ? ' active' : '');
  el.dataset.cid = cid;
  el.setAttribute('draggable', 'true');
  el.innerHTML = `
    <span class="chat-item-label">${esc(state.chats[cid] || 'Unknown chat')}</span>
    <button class="row-menu-btn" title="Options" onclick="openChatMenu('${cid}',null,event)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="2.5" r="0.85" fill="currentColor"/><circle cx="6" cy="6" r="0.85" fill="currentColor"/><circle cx="6" cy="9.5" r="0.85" fill="currentColor"/></svg>
    </button>
  `;
  el.addEventListener('click', (e) => {
    if (e.target.closest('.row-menu-btn')) return;
    setActiveChat(cid);
  });
  el.addEventListener('dragstart', (e) => startChatDrag(cid, null, e));
  el.addEventListener('dragend', endDrag);
  return el;
}

// ════════════════════════════════════════════════════════════
// Folder actions
// ════════════════════════════════════════════════════════════
function toggleFolder(fid) {
  const f = state.folders.find(f => f.id === fid);
  if (f) { f.expanded = !f.expanded; renderFolders(); }
}

function openFolderMenu(fid, e) {
  e.stopPropagation();
  const folder = state.folders.find(f => f.id === fid);
  const rect = e.currentTarget.getBoundingClientRect();
  const idx = state.folders.indexOf(folder);

  showDropdown([
    {
      label: 'Rename', icon: pencilIcon(),
      action: () => startRename(fid)
    },
    {
      label: 'Move up', icon: upIcon(), disabled: idx === 0,
      action: () => { if (idx > 0) { state.folders.splice(idx,1); state.folders.splice(idx-1,0,folder); render(); } }
    },
    {
      label: 'Move down', icon: downIcon(), disabled: idx === state.folders.length - 1,
      action: () => { if (idx < state.folders.length-1) { state.folders.splice(idx,1); state.folders.splice(idx+1,0,folder); render(); } }
    },
    { sep: true },
    {
      label: 'Delete folder', icon: trashIcon(), danger: true,
      action: () => openDeleteModal(fid)
    },
  ], rect.right, rect.bottom + 4);
}

function startRename(fid) {
  closeAllDropdowns();
  const folder = state.folders.find(f => f.id === fid);
  const nameEl = document.getElementById(`fname-${fid}`);
  if (!nameEl) return;
  const header = nameEl.closest('.folder-header');
  header.classList.add('menu-open');

  const input = document.createElement('input');
  input.className = 'folder-name-input';
  input.value = folder.name;
  nameEl.replaceWith(input);
  input.focus();
  input.select();

  const commit = () => {
    const val = input.value.trim();
    if (val && val !== folder.name) {
      const dupe = state.folders.find(f => f.id !== fid && f.name.toLowerCase() === val.toLowerCase());
      if (dupe) { toast(`"${val}" already exists`); input.focus(); return; }
      folder.name = val;
      toast(`Folder renamed to "${val}"`);
    }
    header.classList.remove('menu-open');
    render();
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape') { header.classList.remove('menu-open'); render(); }
    e.stopPropagation();
  });
  input.addEventListener('blur', commit);
}

function openDeleteModal(fid) {
  deletingFolderId = fid;
  const folder = state.folders.find(f => f.id === fid);
  const count = folder.chats.length;
  const desc = count === 0
    ? `"${folder.name}" is empty. It will be permanently removed.`
    : `"${folder.name}" contains ${count} chat${count>1?'s':''}. ${count>1?'They':'It'} will return to Recent chats.`;
  document.getElementById('deleteModalDesc').textContent = desc;
  openModal('deleteModal');
}

function confirmDelete() {
  const folder = state.folders.find(f => f.id === deletingFolderId);
  if (!folder) return;
  // Return chats to recent
  folder.chats.forEach(cid => state.recentChats.unshift(cid));
  state.folders = state.folders.filter(f => f.id !== deletingFolderId);
  closeModal('deleteModal');
  toast(`"${folder.name}" deleted — chats moved to Recent`);
  render();
}

function newChatInFolder(fid, e) {
  e.stopPropagation();
  const folder = state.folders.find(f => f.id === fid);
  toast(`New chat will be added to "${folder.name}"`);
}

function newChat() {
  toast('New chat started');
}

// ════════════════════════════════════════════════════════════
// Create folder modal
// ════════════════════════════════════════════════════════════
function openCreateModal(prefillName) {
  editingFolderId = null;
  document.getElementById('modalTitle').textContent = 'Create folder';
  document.getElementById('folderSaveBtn').textContent = 'Create';
  document.getElementById('folderNameInput').value = prefillName || '';
  document.getElementById('folderNameError').style.display = 'none';
  document.getElementById('folderNameInput').classList.remove('has-error');
  openModal('folderModal');
  setTimeout(() => document.getElementById('folderNameInput').focus(), 50);
}

function validateFolderName() {
  const val = document.getElementById('folderNameInput').value.trim();
  const errEl = document.getElementById('folderNameError');
  const inp = document.getElementById('folderNameInput');
  const saveBtn = document.getElementById('folderSaveBtn');

  if (!val) {
    inp.classList.remove('has-error');
    errEl.style.display = 'none';
    saveBtn.disabled = true;
    return false;
  }

  const dupe = state.folders.find(f =>
    f.id !== editingFolderId && f.name.toLowerCase() === val.toLowerCase()
  );
  if (dupe) {
    inp.classList.add('has-error');
    errEl.textContent = 'A folder with this name already exists.';
    errEl.style.display = 'block';
    saveBtn.disabled = true;
    return false;
  }

  inp.classList.remove('has-error');
  errEl.style.display = 'none';
  saveBtn.disabled = false;
  return true;
}

function saveFolder() {
  if (!validateFolderName()) return;
  const name = document.getElementById('folderNameInput').value.trim();

  if (editingFolderId) {
    const f = state.folders.find(f => f.id === editingFolderId);
    f.name = name;
    toast(`Folder updated`);
  } else {
    const id = uid();
    state.folders.push({ id, name, expanded: false, chats: [] });
    toast(`Folder "${name}" created`);
  }

  closeModal('folderModal');
  render();
}

// ════════════════════════════════════════════════════════════
// Chat context menu
// ════════════════════════════════════════════════════════════
function openChatMenu(cid, currentFolderId, e) {
  e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();

  const hasFolders = state.folders.length > 0;
  const inFolder = !!currentFolderId;

  const items = [
    {
      label: 'Move to folder',
      icon: folderIcon(),
      submenu: true,
      action: () => openMoveToFolderMenu(cid, currentFolderId, rect),
      disabled: !hasFolders,
    },
  ];

  if (inFolder) {
    items.push({
      label: 'Remove from folder', icon: removeFolderIcon(),
      action: () => {
        const folder = state.folders.find(f => f.id === currentFolderId);
        folder.chats = folder.chats.filter(c => c !== cid);
        state.recentChats.unshift(cid);
        toast(`Removed from "${folder.name}"`);
        render();
      }
    });
  }

  items.push({ sep: true });
  items.push({
    label: 'Delete chat', icon: trashIcon(), danger: true,
    action: () => {
      deleteChat(cid, currentFolderId);
    }
  });

  showDropdown(items, rect.right, rect.bottom + 4);
}

function openMoveToFolderMenu(cid, currentFolderId, anchorRect) {
  closeAllDropdowns();
  const items = state.folders.map(f => ({
    label: f.name,
    icon: folderIcon(),
    checked: f.id === currentFolderId,
    action: () => {
      if (f.id === currentFolderId) return;
      moveChatToFolder(cid, f.id);
    }
  }));

  items.push({ sep: true });
  items.push({
    label: 'New folder…',
    icon: plusIcon(),
    action: () => {
      const nameHint = state.chats[cid] ? state.chats[cid].slice(0,20) : '';
      openCreateModal();
      // After create, auto-move — simplified for prototype
      toast('Create folder then move the chat from its menu');
    }
  });

  // Position submenu to the right of the anchor, or flip left if near edge
  let x = anchorRect.right + 8;
  if (x + 200 > window.innerWidth) x = anchorRect.left - 208;
  showDropdown(items, x, anchorRect.top, true);
}

function moveChatToFolder(cid, folderId) {
  // Remove from current folder if any
  state.folders.forEach(f => { f.chats = f.chats.filter(c => c !== cid); });
  // Remove from recent
  state.recentChats = state.recentChats.filter(c => c !== cid);
  // Add to target folder
  const target = state.folders.find(f => f.id === folderId);
  if (!target) return;
  target.chats.unshift(cid);
  target.expanded = true;
  toast(`Moved to "${target.name}"`);
  render();
}

function deleteChat(cid, folderId) {
  if (folderId) {
    const f = state.folders.find(f => f.id === folderId);
    if (f) f.chats = f.chats.filter(c => c !== cid);
  } else {
    state.recentChats = state.recentChats.filter(c => c !== cid);
  }
  delete state.chats[cid];
  if (state.activeChat === cid) { state.activeChat = null; }
  toast('Chat deleted');
  render();
}

function setActiveChat(cid) {
  state.activeChat = cid;
  render();
  renderChatView(cid);
}

// ════════════════════════════════════════════════════════════
// Drag & Drop
// ════════════════════════════════════════════════════════════
const dragState = { type: null, chatId: null, folderId: null, folderId2: null, ghost: null };

function startChatDrag(cid, folderId, e) {
  dragState.type = 'chat';
  dragState.chatId = cid;
  dragState.fromFolder = folderId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', cid);

  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.textContent = state.chats[cid] || cid;
  document.body.appendChild(ghost);
  dragState.ghost = ghost;
  e.dataTransfer.setDragImage(ghost, 10, 10);

  const el = e.currentTarget;
  setTimeout(() => el.classList.add('dragging'), 0);

  // Setup recent drop zone
  const recentEl = document.getElementById('recentList');
  recentEl.addEventListener('dragover', onRecentDragOver);
  recentEl.addEventListener('drop', onRecentDrop);
}

function startFolderDrag(fid, e) {
  dragState.type = 'folder';
  dragState.folderId = fid;
  e.dataTransfer.effectAllowed = 'move';

  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  const f = state.folders.find(f => f.id === fid);
  ghost.textContent = f.name;
  document.body.appendChild(ghost);
  dragState.ghost = ghost;
  e.dataTransfer.setDragImage(ghost, 10, 10);
}

function endDrag() {
  dragState.type = null;
  dragState.chatId = null;
  dragState.folderId = null;
  if (dragState.ghost) { dragState.ghost.remove(); dragState.ghost = null; }
  clearDropTargets();
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));

  const recentEl = document.getElementById('recentList');
  recentEl.removeEventListener('dragover', onRecentDragOver);
  recentEl.removeEventListener('drop', onRecentDrop);
}

function onRecentDragOver(e) {
  if (dragState.type === 'chat') {
    e.preventDefault();
    clearDropTargets();
    e.currentTarget.classList.add('drop-target');
  }
}

function onRecentDrop(e) {
  if (dragState.type === 'chat') {
    e.preventDefault();
    const cid = dragState.chatId;
    // Remove from folder if in one
    state.folders.forEach(f => { f.chats = f.chats.filter(c => c !== cid); });
    // Add to recent if not already there
    if (!state.recentChats.includes(cid)) {
      state.recentChats.unshift(cid);
      toast('Removed from folder — back in Recent chats');
    }
    clearDropTargets();
    endDrag();
    render();
  }
}

function reorderFolder(draggedId, targetId) {
  const from = state.folders.findIndex(f => f.id === draggedId);
  const to = state.folders.findIndex(f => f.id === targetId);
  if (from === -1 || to === -1 || from === to) return;
  const [item] = state.folders.splice(from, 1);
  state.folders.splice(to, 0, item);
  render();
}

function clearDropTargets() {
  document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
  document.querySelectorAll('.folder-drag-over-above,.folder-drag-over-below')
    .forEach(el => { el.classList.remove('folder-drag-over-above','folder-drag-over-below'); });
}

// ════════════════════════════════════════════════════════════
// Dropdown utility
// ════════════════════════════════════════════════════════════
function showDropdown(items, x, y, isSubmenu) {
  closeAllDropdowns();
  const dd = document.createElement('div');
  dd.className = isSubmenu ? 'dropdown submenu' : 'dropdown';
  dd.id = 'activeDropdown';

  items.forEach(item => {
    if (item.sep) {
      const sep = document.createElement('div');
      sep.className = 'dd-sep';
      dd.appendChild(sep);
      return;
    }

    const el = document.createElement('div');
    el.className = 'dd-item' + (item.danger ? ' danger' : '') + (item.disabled ? ' disabled' : '') + (item.checked ? ' checked' : '');

    let html = '';
    if (item.icon) {
      html += `<span class="dd-icon">${item.icon}</span>`;
    }
    html += `<span>${esc(item.label)}</span>`;
    if (item.checked) {
      html += `<span class="dd-check">${checkIcon()}</span>`;
    }
    if (item.submenu) {
      html += `<span class="dd-arrow">${chevronRightIcon()}</span>`;
    }
    el.innerHTML = html;

    if (!item.disabled) {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        closeAllDropdowns();
        item.action && item.action();
      });
      if (item.submenu) {
        el.addEventListener('mouseenter', () => {
          const r = el.getBoundingClientRect();
          item.action && item.action();
        });
      }
    }
    dd.appendChild(el);
  });

  document.body.appendChild(dd);

  // Position — flip if near edge
  const ddW = 200, ddH = items.length * 36;
  let left = x, top = y;
  if (left + ddW > window.innerWidth - 8) left = x - ddW - (isSubmenu ? 0 : 0);
  if (top + ddH > window.innerHeight - 8) top = y - ddH;
  dd.style.left = `${Math.max(8, left)}px`;
  dd.style.top  = `${Math.max(8, top)}px`;

  // Close on outside click
  setTimeout(() => {
    document.addEventListener('click', closeAllDropdowns, { once: true });
  }, 0);
}

function closeAllDropdowns() {
  document.querySelectorAll('#activeDropdown,.dropdown,.submenu').forEach(el => el.remove());
}

// ════════════════════════════════════════════════════════════
// Modal utilities
// ════════════════════════════════════════════════════════════
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function handleOverlayClick(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

// ════════════════════════════════════════════════════════════
// Toast
// ════════════════════════════════════════════════════════════
function toast(msg) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity 0.25s, transform 0.25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-4px)';
    setTimeout(() => el.remove(), 260);
  }, 2400);
}

function esc(s) { const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

// Design system folder icon — cms/icons/16x16/folder (sm, regular)
const FOLDER_PATH = `M 11.2 1.6 H 6.9 L 5.69 0.47 C 5.39 0.17 4.98 0 4.56 0 H 1.6 C 0.72 0 0 0.72 0 1.6 V 9.6 C 0 10.48 0.72 11.2 1.6 11.2 H 11.2 C 12.08 11.2 12.8 10.48 12.8 9.6 V 3.2 C 12.8 2.32 12.1 1.6 11.2 1.6 Z M 11.6 9.6 C 11.6 9.82 11.42 10 11.2 10 H 1.6 C 1.38 10 1.2 9.82 1.2 9.6 V 1.6 C 1.2 1.38 1.38 1.2 1.6 1.2 H 4.54 C 4.64 1.2 4.74 1.24 4.82 1.32 L 6.4 2.8 H 11.2 C 11.42 2.8 11.6 2.98 11.6 3.2 V 9.6 Z`;

function folderSvg(size = 14) {
  return `<svg width="${size}" height="${Math.round(size*11.2/12.8)}" viewBox="0 0 12.8 11.2" fill="currentColor"><path fill-rule="nonzero" d="${FOLDER_PATH}"/></svg>`;
}

function pencilIcon() { return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function trashIcon()  { return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 4.5h9M5 4.5V3.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5v1M11 4.5l-.75 7H3.75L3 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>`; }
function folderIcon() { return folderSvg(14); }
function removeFolderIcon() { return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1.5 10V4.5a1 1 0 0 1 1-1h3L7 5h5a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H2.5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.2"/><path d="M5 8.5h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>`; }
function plusIcon()   { return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2.5v9M2.5 7h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`; }
function checkIcon()  { return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7l3.5 3.5L11.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function upIcon()     { return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 11V3M3.5 6.5 7 3l3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function downIcon()   { return `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 3v8M3.5 7.5 7 11l3.5-3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function chevronRightIcon() { return `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.5 2.5L8 6L4.5 9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

});
