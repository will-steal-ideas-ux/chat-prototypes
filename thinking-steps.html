<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexos.ai — Thinking Steps</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

    :root {
      --background: 0 0% 100%;
      --foreground: 258 6% 15%;
      --muted: 240 5% 97%;
      --muted-foreground: 258 4% 45%;
      --border: 240 6% 90%;
      --primary: 252 100% 64%;
      --accent: 252 100% 96%;
      --radius: 0.5rem;

      --bg-primary:         hsl(var(--muted));
      --bg-secondary:       hsl(var(--background));
      --bg-tertiary:        hsl(240 4% 50% / 0.10);
      --border-secondary:   hsl(var(--border));
      --text-primary:       hsl(var(--foreground));
      --text-secondary:     hsl(300 1% 27%);
      --text-tertiary:      hsl(var(--muted-foreground));
      --text-placeholder:   hsl(var(--muted-foreground));
      --brand-purple:       hsl(var(--primary));
      --brand-purple-light: hsl(var(--accent));
      --accent-color:       hsl(var(--primary));

      /* HUD positioning anchor */
      --hud-top: 0;
      --radius-xs:   calc(var(--radius) * 0.5);
      --radius-sm:   var(--radius);
      --radius-md:   calc(var(--radius) * 2);
      --radius-full: 9999px;

      --shadow-sm: 0 1px 3px hsl(252 100% 14% / 0.10), 0 1px 2px hsl(252 100% 14% / 0.05);
      --shadow-lg: 0 8px 15px hsl(252 100% 14% / 0.06), 0 4px 7px hsl(252 100% 14% / 0.03);
      --transition: .15s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── Layout ────────────────────────── */
    .body-layout { display: flex; flex: 1; overflow: hidden; }

    /* ─── Sidebar (minimal stub) ────────── */
    .sidebar {
      width: 264px; background: var(--bg-primary);
      display: flex; flex-direction: column;
      flex-shrink: 0; overflow: hidden;
      border-right: 1px solid var(--border-secondary);
    }
    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 10px 10px 16px; flex-shrink: 0;
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; flex: 1;
    }
    .logo-emblem {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--text-primary);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-emblem svg { width: 14px; height: 14px; color: white; }
    .logo-name {
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 16px;
      color: var(--text-primary); letter-spacing: -0.3px;
    }
    .logo-name sup { color: var(--accent-color); font-size: 11px; font-weight: 500; }
    .icon-btn {
      width: 32px; height: 32px; border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; background: transparent; border: none;
      color: var(--text-tertiary); transition: background var(--transition), color var(--transition);
    }
    .icon-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .icon-btn svg { width: 20px; height: 20px; }
    .sidebar-footer {
      margin-top: auto;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; flex-shrink: 0; border-top: 1px solid var(--border-secondary);
    }
    .sidebar-avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: #e0d8ff; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: var(--accent-color); cursor: pointer;
    }
    .sidebar-email { font-size: 13px; color: var(--text-secondary); }

    /* ─── Main ───────────────────────────── */
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-thread {
      flex: 1; overflow-y: auto; padding: 40px 0 0;
      display: flex; flex-direction: column;
    }
    .chat-thread::-webkit-scrollbar { width: 4px; }
    .chat-thread::-webkit-scrollbar-thumb { background: var(--border-secondary); border-radius: 2px; }
    .chat-messages {
      width: 100%; max-width: 760px; margin: 0 auto;
      padding: 0 24px 32px; display: flex; flex-direction: column; gap: 24px;
    }

    /* ─── Messages ───────────────────────── */
    .msg-row.user { display: flex; justify-content: flex-end; }
    .msg-bubble.user {
      max-width: 68%; background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      border-radius: 16px 16px 4px 16px;
      padding: 12px 16px; font-size: 15px; line-height: 24px;
    }
    .msg-row.ai { display: flex; flex-direction: column; gap: 8px; }
    .ai-badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 400; color: #5a5a5b;
      padding-bottom: 4px;
    }
    .ai-badge-icon {
      width: 24px; height: 24px; border-radius: 9999px;
      background: #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .ai-badge-icon svg { width: 13px; height: 13px; }
    .msg-bubble.ai { font-size: 15px; line-height: 24px; color: var(--text-primary); }

    /* ─── Prompt ─────────────────────────── */
    .prompt-wrap {
      width: 100%; max-width: 760px; padding: 0 24px 24px; margin: 0 auto;
    }
    .prompt-box {
      position: relative; background: #fff;
      border: 1px solid var(--border-secondary); border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
    }
    .prompt-textarea-row { padding: 14px 16px 0; }
    .prompt-textarea {
      width: 100%; border: none; outline: none; resize: none;
      font-family: 'Inter', sans-serif; font-size: 15px; line-height: 24px;
      color: var(--text-primary); background: transparent; max-height: 200px;
    }
    .prompt-textarea::placeholder { color: var(--text-placeholder); }
    .prompt-actions {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px 12px;
    }
    .prompt-actions-left { display: flex; align-items: center; gap: 2px; }
    .prompt-actions-right { display: flex; align-items: center; gap: 4px; }
    .prompt-btn {
      display: inline-flex; align-items: center; gap: 5px;
      height: 32px; padding: 0 10px; border-radius: var(--radius-sm);
      border: none; background: transparent; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      transition: background var(--transition), color var(--transition);
    }
    .prompt-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .prompt-btn svg { width: 16px; height: 16px; }
    .send-btn {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      background: var(--brand-purple); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity var(--transition);
    }
    .send-btn:hover { opacity: .88; }
    .send-btn svg { width: 16px; height: 16px; color: #fff; }

    /* ─── Version switcher ─────────────────── */
    .version-switcher {
      position: fixed; bottom: 20px; left: 20px;
      z-index: 9999; font-family: 'Inter', sans-serif;
    }
    .version-trigger {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; background: var(--bg-secondary);
      border: 1px solid var(--border-secondary); border-radius: var(--radius-full);
      box-shadow: 0 2px 8px rgba(18,0,69,.08); cursor: pointer; user-select: none;
    }
    .version-trigger-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .version-trigger-desc { font-size: 12px; color: var(--text-tertiary); }
    .version-trigger svg { width: 14px; height: 14px; color: var(--text-tertiary); transition: transform var(--transition); }
    .version-switcher.open .version-trigger svg { transform: rotate(180deg); }
    .version-dropdown {
      position: absolute; bottom: calc(100% + 6px); left: 0;
      background: var(--bg-secondary); border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 24px rgba(18,0,69,.10), 0 2px 8px rgba(18,0,69,.06);
      padding: 4px; min-width: 200px; display: none;
    }
    .version-switcher.open .version-dropdown { display: block; }
    .version-option {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 6px; cursor: pointer;
      text-decoration: none; transition: background var(--transition);
    }
    .version-option:hover { background: var(--bg-primary); }
    .version-option.current { background: var(--bg-primary); }
    .version-option-label { font-size: 13px; font-weight: 600; color: var(--text-primary); min-width: 32px; }
    .version-option-desc { font-size: 13px; color: var(--text-secondary); }
    .version-option-check { margin-left: auto; width: 14px; height: 14px; color: var(--accent-color); opacity: 0; }
    .version-option.current .version-option-check { opacity: 1; }


    /* ════════════════════════════════════════════════════════════
       VARIANT A — Pill Stream
       Inspired by Perplexity. Horizontal chips, one at a time.
       Done chips collapse; active chip pulses. Whole row
       compresses to a single "Done" chip after completion.
       ════════════════════════════════════════════════════════════ */
    .ts-pill-stream {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      min-height: 32px;
    }
    .ts-pill {
      display: inline-flex; align-items: center; gap: 6px;
      height: 28px; padding: 0 10px;
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-full);
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      white-space: nowrap;
      transition: all .25s ease;
      overflow: hidden;
    }
    .ts-pill svg { width: 14px; height: 14px; flex-shrink: 0; }
    .ts-pill.active {
      background: var(--brand-purple-light);
      border-color: hsl(252 100% 64% / .3);
      color: var(--brand-purple);
    }
    .ts-pill.active .ts-pill-icon { animation: pill-spin 1.2s linear infinite; }
    @keyframes pill-spin { to { transform: rotate(360deg); } }
    .ts-pill.done {
      background: var(--bg-primary);
      border-color: var(--border-secondary);
      color: var(--text-tertiary);
    }
    .ts-pill.done .ts-pill-label { display: none; }
    .ts-pill.done { padding: 0 8px; }
    .ts-pill.summary {
      background: var(--bg-primary);
      border-color: var(--border-secondary);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .ts-pill.summary:hover { border-color: var(--brand-purple); color: var(--text-primary); }
    .ts-pill-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: hsl(142 70% 45%); flex-shrink: 0;
    }


    /* ════════════════════════════════════════════════════════════
       VARIANT B — Activity Log
       Manus-style collapsible vertical log. Expanding reveals
       steps with icon + label + duration. Collapses to one line.
       ════════════════════════════════════════════════════════════ */
    .ts-log-wrap { display: flex; flex-direction: column; gap: 0; }
    .ts-log-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer; padding: 0;
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      transition: color var(--transition); width: fit-content;
    }
    .ts-log-toggle:hover { color: var(--text-primary); }
    .ts-log-toggle-icon {
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; background: var(--bg-tertiary); flex-shrink: 0;
    }
    .ts-log-toggle-icon svg { width: 12px; height: 12px; transition: transform .2s; }
    .ts-log-toggle.open .ts-log-toggle-icon svg { transform: rotate(180deg); }
    .ts-log-toggle-spinner {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid hsl(252 100% 64% / .25);
      border-top-color: var(--brand-purple);
      animation: log-spin .8s linear infinite; flex-shrink: 0;
    }
    @keyframes log-spin { to { transform: rotate(360deg); } }

    .ts-log-body {
      overflow: hidden; max-height: 0;
      transition: max-height .3s ease, opacity .2s ease, margin .2s ease;
      opacity: 0; margin-top: 0;
    }
    .ts-log-body.open { max-height: 400px; opacity: 1; margin-top: 10px; }

    .ts-log-inner {
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .ts-step {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border-secondary);
      font-size: 13px; color: var(--text-secondary);
    }
    .ts-step:last-child { border-bottom: none; }
    .ts-step.active { background: hsl(252 100% 64% / .04); }
    .ts-step-status { flex-shrink: 0; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
    .ts-step-status-check svg { width: 14px; height: 14px; color: hsl(142 70% 45%); }
    .ts-step-status-spin {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid hsl(252 100% 64% / .25);
      border-top-color: var(--brand-purple);
      animation: log-spin .8s linear infinite;
    }
    .ts-step-status-pending { width: 6px; height: 6px; border-radius: 50%; background: var(--border-secondary); margin: auto; }
    .ts-step-icon { font-size: 14px; flex-shrink: 0; }
    .ts-step-label { flex: 1; line-height: 20px; }
    .ts-step.active .ts-step-label { color: var(--text-primary); font-weight: 500; }
    .ts-step-dur { font-size: 12px; color: var(--text-tertiary); flex-shrink: 0; }
    .ts-step-expand {
      font-size: 11px; color: var(--text-tertiary); cursor: pointer;
      padding: 2px 6px; border-radius: 4px; transition: background var(--transition), color var(--transition);
      border: 1px solid var(--border-secondary); background: var(--bg-secondary);
    }
    .ts-step-expand:hover { color: var(--text-primary); background: var(--bg-tertiary); }

    .ts-step-detail {
      overflow: hidden; max-height: 0;
      transition: max-height .2s ease, opacity .15s ease;
      opacity: 0;
    }
    .ts-step-detail.open { max-height: 120px; opacity: 1; }
    .ts-step-detail-inner {
      margin: 0 14px 10px 40px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-secondary);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: 'Inter', sans-serif; font-size: 12px;
      color: var(--text-tertiary); line-height: 18px;
    }


    /* ════════════════════════════════════════════════════════════
       VARIANT C — Ghost Cards (inline, low-weight)
       Each tool call is a quiet separator card between messages.
       Expands on click to show I/O.
       ════════════════════════════════════════════════════════════ */
    .ts-ghost {
      width: 100%;
      display: flex; flex-direction: column; gap: 2px;
    }
    .ts-ghost-card {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      border: 1px dashed hsl(240 6% 88%);
      background: transparent;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      font-size: 13px; color: var(--text-tertiary);
    }
    .ts-ghost-card:hover {
      background: hsl(240 4% 50% / .05);
      border-color: hsl(240 6% 80%);
      color: var(--text-secondary);
    }
    .ts-ghost-card.expanded {
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      color: var(--text-secondary);
    }
    .ts-ghost-card-icon { font-size: 14px; flex-shrink: 0; }
    .ts-ghost-card-label { flex: 1; font-weight: 500; }
    .ts-ghost-card-method {
      font-size: 11px; font-weight: 600; letter-spacing: .4px;
      padding: 2px 6px; border-radius: 3px;
      background: hsl(240 6% 92%); color: var(--text-tertiary);
    }
    .ts-ghost-card-method.get { background: hsl(142 60% 92%); color: hsl(142 60% 28%); }
    .ts-ghost-card-method.post { background: hsl(210 80% 92%); color: hsl(210 80% 32%); }
    .ts-ghost-card-method.tool { background: var(--brand-purple-light); color: var(--brand-purple); }
    .ts-ghost-card-chevron { width: 14px; height: 14px; transition: transform .2s; flex-shrink: 0; }
    .ts-ghost-card.expanded .ts-ghost-card-chevron { transform: rotate(180deg); }
    .ts-ghost-card-dur { font-size: 12px; color: var(--text-tertiary); flex-shrink: 0; }

    .ts-ghost-detail {
      overflow: hidden; max-height: 0;
      transition: max-height .25s ease, opacity .2s ease;
      opacity: 0;
    }
    .ts-ghost-detail.open { max-height: 220px; opacity: 1; }
    .ts-ghost-detail-inner {
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary); border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .ts-ghost-io-row { display: flex; flex-direction: column; gap: 4px; }
    .ts-ghost-io-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-tertiary); }
    .ts-ghost-io-val {
      font-size: 12px; font-family: 'Inter', sans-serif; line-height: 18px;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      border: 1px solid var(--border-secondary);
      border-radius: 6px; padding: 6px 8px;
    }

    /* Animated in */
    @keyframes msg-in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .animate-in { animation: msg-in .2s ease; }

    /* Typing dots */
    .typing-indicator { display: flex; align-items: center; gap: 4px; height: 24px; }
    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary);
      animation: td .9s ease infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: .15s; }
    .typing-dot:nth-child(3) { animation-delay: .3s; }
    @keyframes td { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-4px);opacity:1} }

    /* Scenario picker strip */
    .scenario-strip {
      width: 100%; max-width: 760px; margin: 0 auto;
      padding: 0 24px 12px;
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    .scenario-label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-right: 4px; }
    .scenario-btn {
      height: 28px; padding: 0 12px;
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-full); background: var(--bg-secondary);
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; transition: all var(--transition); white-space: nowrap;
    }
    .scenario-btn:hover { border-color: var(--brand-purple); color: var(--brand-purple); }
    .scenario-btn.active { background: var(--brand-purple-light); border-color: hsl(252 100% 64% / .4); color: var(--brand-purple); }


    /* ════════════════════════════════════════════════════════════
       VARIANT D — Morphing Status Line
       Single line that updates in-place as each step finishes.
       Fades between states. Collapses to "Done in Xs ›" link.
       ════════════════════════════════════════════════════════════ */
    .ts-status-line {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px;
      min-height: 22px;
      width: fit-content;
    }
    .ts-status-line:hover .ts-status-arrow { opacity: 1; }
    .ts-status-text {
      background: linear-gradient(
        90deg,
        hsl(240 4% 60%) 0%,
        hsl(240 4% 60%) 30%,
        hsl(240 4% 82%) 50%,
        hsl(240 4% 60%) 70%,
        hsl(240 4% 60%) 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: text-shimmer 3.2s linear infinite;
      transition: opacity .35s ease;
    }
    @keyframes text-shimmer {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .ts-status-text.fade { opacity: 0; }
    .ts-status-arrow {
      display: flex; align-items: center;
      color: hsl(240 4% 72%);
      animation: arrow-nudge 2.8s ease infinite;
      flex-shrink: 0;
    }
    .ts-status-arrow svg { width: 14px; height: 14px; transition: transform .2s ease; }
    .ts-status-line.log-open .ts-status-arrow svg { transform: rotate(90deg); }
    @keyframes arrow-nudge {
      0%,100% { transform: translateX(0); opacity: .4; }
      50%      { transform: translateX(4px); opacity: .9; }
    }
    .ts-status-done {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 500; color: var(--text-tertiary);
      cursor: pointer; border: none; background: none; padding: 0;
      transition: color var(--transition);
    }
    .ts-status-done { display: inline-flex; align-items: center; gap: 4px; }
    .ts-status-done:hover { color: var(--text-primary); }
    .ts-status-done svg { transition: transform .2s ease; }
    .ts-status-line.log-open .ts-status-done svg { transform: rotate(90deg); }

    .ts-status-log {
      overflow: hidden; max-height: 0;
      transition: max-height .25s ease, opacity .2s ease, margin .15s ease;
      opacity: 0; margin-top: 0;
    }
    .ts-status-log.open { max-height: 300px; opacity: 1; margin-top: 8px; }
    .ts-status-log-inner { overflow: hidden; }
    .ts-status-log.open { max-height: 900px; }

    /* ── Step rows ── */
    @keyframes step-fade-in {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ts-detail-step {
      display: flex; flex-direction: column;
      animation: step-fade-in .3s ease forwards;
    }

    .ts-detail-step-header {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 5px 0; font-size: 13px; color: var(--text-tertiary);
    }
    .ts-detail-step-icon {
      width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--text-tertiary); opacity: .7;
    }
    .ts-detail-step-icon svg { width: 14px; height: 14px; }
    .ts-detail-step-label { flex: 1; font-size: 13px; color: var(--text-tertiary); line-height: 20px; }

    .ts-detail-step-body {
      margin-left: 28px; padding: 1px 0 8px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .ts-detail-step-body-line {
      font-size: 12px; color: var(--text-tertiary); opacity: .55; line-height: 18px;
    }
    .ts-detail-step-body-sublabel {
      opacity: .75; font-weight: 500; margin-top: 6px;
    }

    /* ── Figma-style search section ── */
    .ts-search-section { display: flex; flex-direction: column; gap: 6px; padding: 4px 0 12px; }
    .ts-search-query-header {
      display: flex; align-items: flex-start; gap: 7px;
      font-size: 13px; color: var(--text-tertiary);
    }
    .ts-search-query-header svg { width: 14px; height: 14px; flex-shrink: 0; opacity: .6; }
    .ts-search-query-text { flex: 1; }
    .ts-search-query-count { font-size: 12px; opacity: .5; flex-shrink: 0; }

    .ts-search-results-box {
      border: 1px solid hsl(240 4% 55%);
      border-radius: 7px; overflow-y: auto; max-height: 130px;
    }
    .ts-search-results-box::-webkit-scrollbar { width: 4px; }
    .ts-search-results-box::-webkit-scrollbar-track { background: transparent; }
    .ts-search-results-box::-webkit-scrollbar-thumb { background: hsl(240 4% 28%); border-radius: 2px; }
    .ts-search-result-row {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 10px 14px; font-size: 12px; color: var(--text-tertiary);
    }
    .ts-search-result-favicon {
      width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0;
      object-fit: contain;
    }
    .ts-search-result-title { flex: 1; }
    .ts-search-result-domain { font-size: 11px; opacity: .45; flex-shrink: 0; margin-left: 6px; }

    /* Sub-query rows (non-search steps) */
    .ts-sub-query {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; font-size: 13px; color: var(--text-tertiary);
    }
    .ts-sub-query-icon { width: 14px; height: 14px; flex-shrink: 0; opacity: .5; }
    .ts-sub-query-icon svg { width: 14px; height: 14px; }
    .ts-sub-result {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; font-size: 13px; color: var(--text-tertiary);
    }
    .ts-sub-favicon {
      width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; color: #fff; letter-spacing: 0;
    }
    .ts-sub-result-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ts-sub-result-domain { font-size: 12px; color: var(--text-tertiary); opacity: .6; flex-shrink: 0; }
    .ts-sub-more {
      font-size: 12px; color: var(--text-tertiary); opacity: .6;
      padding: 4px 0 0; cursor: pointer;
    }
    .ts-sub-more:hover { opacity: 1; }


    /* ════════════════════════════════════════════════════════════
       VARIANT E — Timeline Rail
       Thin vertical track with step dots on the left.
       Active dot pulses purple. Done = filled green. Hover = tooltip.
       ════════════════════════════════════════════════════════════ */
    .ts-rail {
      display: flex; gap: 14px; align-items: flex-start;
    }
    .ts-rail-track {
      display: flex; flex-direction: column; align-items: center;
      flex-shrink: 0; padding-top: 3px;
    }
    .ts-rail-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      background: var(--border-secondary); position: relative; cursor: default;
      transition: background .2s ease, box-shadow .2s ease;
    }
    .ts-rail-dot.done { background: hsl(142 70% 45%); }
    .ts-rail-dot.active {
      background: var(--brand-purple);
      box-shadow: 0 0 0 3px hsl(252 100% 64% / .2);
      animation: rail-pulse 1.4s ease infinite;
    }
    @keyframes rail-pulse {
      0%,100% { box-shadow: 0 0 0 3px hsl(252 100% 64% / .2); }
      50% { box-shadow: 0 0 0 6px hsl(252 100% 64% / .08); }
    }
    .ts-rail-line {
      width: 2px; flex: 1; min-height: 20px;
      background: var(--border-secondary);
      margin: 3px 0;
    }
    .ts-rail-line.done { background: hsl(142 70% 45% / .4); }

    .ts-rail-steps { display: flex; flex-direction: column; gap: 0; flex: 1; }
    .ts-rail-step {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 0 0 20px 0; font-size: 13px; line-height: 18px;
      color: var(--text-tertiary); position: relative;
    }
    .ts-rail-step:last-child { padding-bottom: 0; }
    .ts-rail-step.active { color: var(--text-primary); font-weight: 500; }
    .ts-rail-step.done { color: var(--text-secondary); }
    .ts-rail-step-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }
    .ts-rail-step-text { flex: 1; }
    .ts-rail-step-dur { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; margin-top: 2px; }


    /* ════════════════════════════════════════════════════════════
       VARIANT F — Source Chips
       Steps run silently. Reply appears with [n] footnotes.
       Below reply: a row of expandable reference cards.
       ════════════════════════════════════════════════════════════ */
    .ts-working-line {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-tertiary);
    }
    .ts-working-spinner {
      width: 11px; height: 11px; border-radius: 50%;
      border: 2px solid hsl(252 100% 64% / .2);
      border-top-color: var(--brand-purple);
      animation: log-spin .8s linear infinite; flex-shrink: 0;
    }

    .ts-reply-with-refs { font-size: 15px; line-height: 24px; color: var(--text-primary); }
    .ts-ref-tag {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 3px;
      background: var(--brand-purple-light); color: var(--brand-purple);
      font-size: 10px; font-weight: 700; line-height: 1;
      cursor: pointer; margin: 0 1px; vertical-align: middle;
      transition: background var(--transition);
      text-decoration: none;
    }
    .ts-ref-tag:hover { background: hsl(252 100% 64% / .2); }

    .ts-sources-row {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;
    }
    .ts-source-chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 28px; padding: 0 10px;
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      font-size: 12px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; white-space: nowrap;
      transition: border-color var(--transition), background var(--transition);
    }
    .ts-source-chip:hover { border-color: var(--brand-purple); background: var(--brand-purple-light); color: var(--brand-purple); }
    .ts-source-chip.expanded { border-color: var(--brand-purple); background: var(--brand-purple-light); color: var(--brand-purple); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
    .ts-source-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 3px;
      background: var(--brand-purple); color: #fff;
      font-size: 9px; font-weight: 700; flex-shrink: 0;
    }
    .ts-source-detail {
      overflow: hidden; max-height: 0;
      transition: max-height .25s ease, opacity .2s ease;
      opacity: 0;
    }
    .ts-source-detail.open { max-height: 120px; opacity: 1; }
    .ts-source-detail-inner {
      background: var(--brand-purple-light);
      border: 1px solid hsl(252 100% 64% / .3); border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      padding: 8px 12px;
      font-size: 12px; color: hsl(252 30% 35%); line-height: 18px;
    }


    /* ════════════════════════════════════════════════════════════
       VARIANT G — Step-before-reply Card
       Single collapsed card sits above reply text.
       Loading during processing, shows summary after done.
       Click to expand a clean step list.
       ════════════════════════════════════════════════════════════ */
    .ts-receipt {
      display: flex; flex-direction: column;
    }
    .ts-receipt-header {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px;
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; user-select: none;
      transition: border-color var(--transition), border-radius var(--transition);
    }
    .ts-receipt-header:hover { border-color: hsl(252 100% 64% / .4); }
    .ts-receipt-header.expanded { border-radius: var(--radius-sm) var(--radius-sm) 0 0; border-color: var(--border-secondary); }
    .ts-receipt-icon {
      width: 20px; height: 20px; border-radius: 5px;
      background: var(--brand-purple-light);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ts-receipt-icon svg { width: 11px; height: 11px; color: var(--brand-purple); }
    .ts-receipt-icon-spin {
      width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid hsl(252 100% 64% / .2);
      border-top-color: var(--brand-purple);
      animation: log-spin .8s linear infinite;
    }
    .ts-receipt-label { flex: 1; }
    .ts-receipt-meta { font-size: 12px; color: var(--text-tertiary); font-weight: 400; }
    .ts-receipt-chevron { width: 14px; height: 14px; color: var(--text-tertiary); transition: transform .2s; flex-shrink: 0; }
    .ts-receipt-header.expanded .ts-receipt-chevron { transform: rotate(180deg); }

    .ts-receipt-body {
      overflow: hidden; max-height: 0;
      transition: max-height .3s ease, opacity .2s ease;
      opacity: 0;
    }
    .ts-receipt-body.open { max-height: 400px; opacity: 1; }
    .ts-receipt-body-inner {
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary); border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      overflow: hidden;
    }
    .ts-receipt-step {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-bottom: 1px solid var(--border-secondary);
      font-size: 13px; color: var(--text-secondary);
    }
    .ts-receipt-step:last-child { border-bottom: none; }
    .ts-receipt-step-check { width: 14px; height: 14px; color: hsl(142 70% 40%); flex-shrink: 0; }
    .ts-receipt-step-icon { font-size: 13px; flex-shrink: 0; }
    .ts-receipt-step-label { flex: 1; }
    .ts-receipt-step-dur { font-size: 12px; color: var(--text-tertiary); }

    /* ════════════════════════════════════════════════════════════
       VARIANT H — Dot Counter
       Absolute minimum. One pulsing dot + "N / total steps".
       Click to expand a log.
       ════════════════════════════════════════════════════════════ */
    .ts-dot-counter {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text-tertiary);
    }
    .ts-dot-pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--brand-purple); flex-shrink: 0;
      animation: dot-pulse 1.2s ease infinite;
    }
    @keyframes dot-pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .4; transform: scale(.7); }
    }
    .ts-dot-done-icon {
      width: 8px; height: 8px; border-radius: 50%;
      background: hsl(142 70% 45%); flex-shrink: 0;
    }
    .ts-dot-summary-btn {
      background: none; border: none; cursor: pointer; padding: 0;
      font-size: 13px; color: var(--text-tertiary);
      transition: color var(--transition);
    }
    .ts-dot-summary-btn:hover { color: var(--text-primary); }
    .ts-dot-log {
      overflow: hidden; max-height: 0;
      transition: max-height .25s ease, opacity .2s ease, margin .15s ease;
      opacity: 0; margin-top: 0;
    }
    .ts-dot-log.open { max-height: 300px; opacity: 1; margin-top: 8px; }
    .ts-dot-log-inner {
      background: var(--bg-primary); border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm); overflow: hidden;
    }
    .ts-dot-log-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; border-bottom: 1px solid var(--border-secondary);
      font-size: 13px; color: var(--text-secondary);
    }
    .ts-dot-log-row:last-child { border-bottom: none; }
    .ts-dot-log-check { width: 13px; height: 13px; color: hsl(142 70% 40%); flex-shrink: 0; }
    .ts-dot-log-icon { font-size: 13px; flex-shrink: 0; }
    .ts-dot-log-label { flex: 1; }
    .ts-dot-log-dur { font-size: 12px; color: var(--text-tertiary); }


    /* ════════════════════════════════════════════════════════════
       VARIANT I — Prose Narration
       AI narrates what it's doing in flowing first-person text.
       Sentence updates live as steps complete.
       ════════════════════════════════════════════════════════════ */
    .ts-prose {
      font-size: 14px; line-height: 22px; color: var(--text-tertiary);
      font-style: italic;
      min-height: 22px;
    }
    .ts-prose-cursor {
      display: inline-block; width: 2px; height: 13px;
      background: var(--brand-purple); margin-left: 1px;
      vertical-align: middle;
      animation: prose-blink .9s step-end infinite;
    }
    @keyframes prose-blink { 0%,100%{opacity:1} 50%{opacity:0} }


    /* ════════════════════════════════════════════════════════════
       VARIANT J — Terminal Stream
       Monospace dark-bg log. Timestamps, tool names, results.
       Collapses to a one-line summary.
       ════════════════════════════════════════════════════════════ */
    .ts-terminal-wrap { display: flex; flex-direction: column; gap: 0; }
    .ts-terminal-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer; padding: 0;
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      transition: color var(--transition); width: fit-content;
    }
    .ts-terminal-toggle:hover { color: var(--text-primary); }
    .ts-terminal-toggle-icon {
      width: 18px; height: 18px; border-radius: 4px;
      background: hsl(222 15% 15%); display: flex; align-items: center; justify-content: center;
    }
    .ts-terminal-toggle-icon svg { width: 10px; height: 10px; color: hsl(142 70% 55%); transition: transform .2s; }
    .ts-terminal-toggle.open .ts-terminal-toggle-icon svg { transform: rotate(180deg); }

    .ts-terminal-body {
      overflow: hidden; max-height: 0;
      transition: max-height .3s ease, opacity .2s ease, margin .2s ease;
      opacity: 0; margin-top: 0;
    }
    .ts-terminal-body.open { max-height: 400px; opacity: 1; margin-top: 8px; }
    .ts-terminal-block {
      background: hsl(222 15% 12%);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 12px; line-height: 20px;
      overflow-y: auto; max-height: 280px;
    }
    .ts-terminal-block::-webkit-scrollbar { width: 4px; }
    .ts-terminal-block::-webkit-scrollbar-thumb { background: hsl(222 15% 25%); border-radius: 2px; }
    .ts-terminal-line { display: flex; gap: 10px; }
    .ts-terminal-ts { color: hsl(222 15% 45%); flex-shrink: 0; }
    .ts-terminal-cmd { color: hsl(210 80% 70%); }
    .ts-terminal-ok  { color: hsl(142 60% 55%); }
    .ts-terminal-err { color: hsl(0 70% 60%); }
    .ts-terminal-val { color: hsl(35 80% 65%); }
    .ts-terminal-cursor {
      display: inline-block; width: 7px; height: 13px;
      background: hsl(142 60% 55%); margin-left: 2px;
      vertical-align: middle;
      animation: prose-blink .9s step-end infinite;
    }


    /* ════════════════════════════════════════════════════════════
       VARIANT K — Breadcrumb Path
       Horizontal step trail. Done = muted check. Active = purple.
       Pending = grey. Scrolls if overflow.
       ════════════════════════════════════════════════════════════ */
    .ts-breadcrumb {
      display: flex; align-items: center; gap: 0;
      overflow-x: auto; padding-bottom: 2px;
    }
    .ts-breadcrumb::-webkit-scrollbar { height: 0; }
    .ts-bc-step {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 500; color: var(--text-tertiary);
      white-space: nowrap; flex-shrink: 0;
    }
    .ts-bc-step.done  { color: var(--text-tertiary); }
    .ts-bc-step.active { color: var(--brand-purple); }
    .ts-bc-step.pending { color: hsl(240 6% 82%); }
    .ts-bc-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor; flex-shrink: 0;
    }
    .ts-bc-step.active .ts-bc-dot { animation: rail-pulse 1.4s ease infinite; }
    .ts-bc-check { width: 12px; height: 12px; flex-shrink: 0; color: hsl(142 70% 45%); }
    .ts-bc-sep {
      margin: 0 6px; color: var(--border-secondary);
      font-size: 14px; flex-shrink: 0; user-select: none;
    }
    .ts-bc-label { font-size: 13px; }


    /* ════════════════════════════════════════════════════════════
       VARIANT L — Icon Cluster
       Tool icons light up one-by-one in a compact grid.
       Click cluster to expand labels.
       ════════════════════════════════════════════════════════════ */
    .ts-cluster-wrap { display: flex; flex-direction: column; gap: 8px; }
    .ts-cluster {
      display: flex; align-items: center; gap: 4px;
      cursor: pointer;
    }
    .ts-cluster-cell {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-secondary);
      background: var(--bg-primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: all .2s ease;
      opacity: .3;
      flex-shrink: 0;
    }
    .ts-cluster-cell.active {
      opacity: 1;
      border-color: var(--brand-purple);
      background: var(--brand-purple-light);
      animation: cell-pop .3s ease;
    }
    .ts-cluster-cell.done {
      opacity: 1;
      border-color: hsl(142 60% 75%);
      background: hsl(142 60% 96%);
    }
    @keyframes cell-pop {
      0%   { transform: scale(.85); }
      60%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .ts-cluster-hint { font-size: 12px; color: var(--text-tertiary); }

    .ts-cluster-detail {
      overflow: hidden; max-height: 0;
      transition: max-height .25s ease, opacity .2s ease;
      opacity: 0;
    }
    .ts-cluster-detail.open { max-height: 300px; opacity: 1; }
    .ts-cluster-detail-inner {
      background: var(--bg-primary); border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm); overflow: hidden;
    }
    .ts-cluster-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; border-bottom: 1px solid var(--border-secondary);
      font-size: 13px; color: var(--text-secondary);
    }
    .ts-cluster-row:last-child { border-bottom: none; }


    /* ════════════════════════════════════════════════════════════
       VARIANT M — Skeleton → Reveal
       Shimmer placeholder appears first. As each step completes,
       a section resolves from skeleton to real text.
       ════════════════════════════════════════════════════════════ */
    .ts-skeleton-wrap { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .ts-skel-section { display: flex; flex-direction: column; gap: 5px; }
    .ts-skel-line {
      height: 14px; border-radius: 4px; background: #ebebec;
      animation: shimmer 1.4s ease infinite;
    }
    @keyframes shimmer { 0%,100%{opacity:.4} 50%{opacity:.9} }
    .ts-skel-line.w-full  { width: 100%; }
    .ts-skel-line.w-80    { width: 80%; }
    .ts-skel-line.w-60    { width: 60%; }
    .ts-skel-line.w-40    { width: 40%; }
    .ts-skel-reveal {
      font-size: 15px; line-height: 24px; color: var(--text-primary);
      animation: msg-in .3s ease;
    }
    .ts-skel-section-wrap { position: relative; min-height: 48px; }


    /* ════════════════════════════════════════════════════════════
       VARIANT N — Inner Monologue
       Nested micro-thread shows model's internal reasoning.
       Small bubbles in a tinted nested container.
       ════════════════════════════════════════════════════════════ */
    .ts-monologue {
      border-left: 2px solid hsl(252 100% 64% / .25);
      padding: 8px 0 8px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .ts-mono-header {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .5px; color: hsl(252 60% 60%);
      margin-bottom: 2px;
    }
    .ts-mono-header-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: hsl(252 100% 64% / .5);
      animation: dot-pulse 1.2s ease infinite;
    }
    .ts-mono-bubble {
      display: inline-flex; align-items: flex-start; gap: 6px;
      font-size: 13px; line-height: 19px; color: hsl(252 20% 40%);
      animation: msg-in .2s ease;
    }
    .ts-mono-bubble-icon { font-size: 12px; flex-shrink: 0; margin-top: 2px; opacity: .7; }
    .ts-mono-bubble-text { flex: 1; }
    .ts-mono-bubble.done .ts-mono-bubble-text { color: hsl(252 10% 55%); }
    .ts-mono-thinking { color: hsl(252 60% 60%); font-style: italic; }
    .ts-mono-cursor {
      display: inline-block; width: 6px; height: 12px;
      background: hsl(252 100% 64% / .6); margin-left: 2px;
      vertical-align: middle;
      animation: prose-blink .9s step-end infinite;
    }


    /* ════════════════════════════════════════════════════════════
       VARIANT O — Floating HUD Badge
       Small persistent badge fixed to top-right of chat area.
       Shows current step. Disappears when reply is ready.
       ════════════════════════════════════════════════════════════ */
    .ts-hud {
      position: absolute; top: 12px; right: 12px;
      z-index: 100;
      display: flex; align-items: center; gap: 7px;
      padding: 5px 10px 5px 8px;
      background: hsl(222 15% 12%);
      border-radius: var(--radius-full);
      font-size: 12px; font-weight: 500; color: #fff;
      box-shadow: 0 4px 12px hsl(222 15% 5% / .3);
      animation: hud-in .2s ease;
      white-space: nowrap;
    }
    @keyframes hud-in { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
    .ts-hud-out { animation: hud-out .2s ease forwards; }
    @keyframes hud-out { to{opacity:0;transform:translateY(-4px)} }
    .ts-hud-spin {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: hsl(142 70% 55%);
      animation: log-spin .7s linear infinite; flex-shrink: 0;
    }
    .ts-hud-step { color: rgba(255,255,255,.7); }
    .ts-hud-label { color: #fff; }
    .ts-hud-close {
      width: 14px; height: 14px; border: none; background: rgba(255,255,255,.15);
      border-radius: 50%; cursor: pointer; font-size: 9px; color: rgba(255,255,255,.8);
      display: flex; align-items: center; justify-content: center;
      margin-left: 2px;
      transition: background var(--transition);
    }
    .ts-hud-close:hover { background: rgba(255,255,255,.25); }
    /* The chat area needs position:relative for the HUD to anchor */
    .main-area { position: relative; }
  </style>
</head>

  const SCENARIOS = {

        { icon: '📊', label: 'Mapping competitor positioning matrix', dur: '0.8s', detail: 'Axes: price vs complexity\nAll major players cluster in high-price / high-complexity quadrant' },

    },
    long: {
      query: 'Audit our entire ad account and give me a full optimization plan',
      steps: [
        { icon: '🔑', label: 'Authenticated with Google Ads API', dur: '0.2s', detail: 'OAuth2 flow completed\nScopes: campaigns.read, keywords.read, budgets.read' },
        { icon: '🔑', label: 'Authenticated with Meta Business API', dur: '0.2s', detail: 'Access token valid — expires in 58 days\nScopes: ads_read, insights, business_management' },
        { icon: '📊', label: 'Fetched all Google campaigns (90-day window)', dur: '2.1s', detail: '6 campaigns · 28 ad groups · 847 keywords\nMetrics: impressions, clicks, CTR, CPC, conversions, ROAS' },

        { icon: '📄', label: 'Read wordstream.com/google-ads-benchmarks-2025', dur: '0.7s', detail: 'Ecommerce avg ROAS: 4.2x · Your account: 3.1x\nIdentified campaigns underperforming by >25%' },
        { icon: '🔍', label: 'Searched "Performance Max vs Shopping campaign strategy 2025"', dur: '0.3s', detail: 'Evaluating restructuring opportunity for Shopping campaigns' },

        { icon: '📊', label: 'Identifying underperforming creatives on Meta', dur: '1.1s', detail: '8 ads with CTR below 0.4% running for 30+ days\nCreative fatigue detected on 3 top-spend ad sets' },
        { icon: '📝', label: 'Writing optimization recommendations…', dur: null, detail: 'Generating 18 prioritized actions across bidding, creative, targeting, structure\nGrouped by impact and implementation effort' },
      ],
      reply: 'Full audit complete. Found **$1,240/mo in recoverable waste** across 3 areas:\n\n**Quick wins (this week):** Pause 12 low-QS keywords, fix 3 ad sets with audience overlap.\n\n**Medium-term:** Restructure Shopping campaigns into Performance Max, refresh 8 stale creatives.\n\n**Strategic:** Test broad match + Smart Bidding on your top 3 campaigns.'
    }
  };

  function runScenario(s, btn) {
    currentScenario = s;
    document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    clearMessages();
    runScenarioAuto();
  }

  function clearMessages() {
    document.getElementById('chat-messages').innerHTML = '';
  }

  function runScenarioAuto() {
    const sc = SCENARIOS[currentScenario];
    addUserMsg(sc.query);
    setTimeout(() => startThinkingSequence(sc), 600);
  }

  function addUserMsg(text) {
    const msgs = document.getElementById('chat-messages');
    const el = document.createElement('div');
    el.className = 'msg-row user animate-in';
    el.innerHTML = `<div class="msg-bubble user">${escHtml(text)}</div>`;
    msgs.appendChild(el);
    scrollBottom();
  }

  function startThinkingSequence(sc) {
    startStatusLine(sc);
  }

  // ════════════════════════════════════
  // VARIANT A — Pill Stream
  // ════════════════════════════════════
  function startPillStream(sc) {
    const msgs = document.getElementById('chat-messages');

    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    const streamWrap = document.createElement('div');
    streamWrap.className = 'ts-pill-stream';
    aiRow.appendChild(streamWrap);
    scrollBottom();

    let i = 0;
    function nextPill() {
      if (i >= sc.steps.length) {
        // All done — collapse to summary
        streamWrap.innerHTML = '';
        const summary = makePill('summary', '✓', `${sc.steps.length} steps · ${totalDur(sc.steps)}`, false);
        streamWrap.appendChild(summary);
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 300);
        return;
      }

      const step = sc.steps[i];

      // Mark previous as done (show just checkmark)
      if (i > 0) {
        const prev = streamWrap.querySelectorAll('.ts-pill')[i - 1];
        if (prev) {
          prev.classList.remove('active');
          prev.classList.add('done');
          prev.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="hsl(142 70% 40%)" stroke-width="2.5" stroke-linecap="round" style="width:12px;height:12px"><path d="M20 6 9 17l-5-5"/></svg>`;
        }
      }

      const pill = makePill('active', step.icon, step.label, true);
      streamWrap.appendChild(pill);
      scrollBottom();
      i++;

      const delay = step.dur ? parseFloat(step.dur) * 800 + 400 : 1600;
      setTimeout(nextPill, delay);
    }
    nextPill();
  }

  function makePill(cls, icon, label, showLabel) {
    const el = document.createElement('div');
    el.className = `ts-pill ${cls}`;
    el.innerHTML = `<span class="ts-pill-icon" style="font-size:13px;${cls==='active'?'display:inline-block':''}">${icon}</span>${showLabel ? `<span class="ts-pill-label">${label}</span>` : ''}`;
    return el;
  }

  // ════════════════════════════════════
  // VARIANT B — Activity Log
  // ════════════════════════════════════
  function startActivityLog(sc) {
    const msgs = document.getElementById('chat-messages');

    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    // Build the log scaffold (all steps shown upfront as pending)
    const logWrap = document.createElement('div');
    logWrap.className = 'ts-log-wrap';

    const toggle = document.createElement('button');
    toggle.className = 'ts-log-toggle open';
    toggle.id = 'ts-log-toggle';
    toggle.innerHTML = `
      <div class="ts-log-toggle-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <span id="ts-log-summary">Working…</span>`;
    toggle.onclick = () => {
      toggle.classList.toggle('open');
      body.classList.toggle('open');
    };

    const body = document.createElement('div');
    body.className = 'ts-log-body open';
    body.id = 'ts-log-body';

    const inner = document.createElement('div');
    inner.className = 'ts-log-inner';

    sc.steps.forEach((step, idx) => {
      const row = document.createElement('div');
      row.className = 'ts-step';
      row.id = `ts-step-${idx}`;
      row.innerHTML = stepRow(step, idx === 0 ? 'active' : 'pending', idx);
      inner.appendChild(row);

      const detail = document.createElement('div');
      detail.className = 'ts-step-detail';
      detail.id = `ts-step-detail-${idx}`;
      detail.innerHTML = `<div class="ts-step-detail-inner">${step.detail.replace(/\n/g,'<br>')}</div>`;
      inner.appendChild(detail);
    });

    body.appendChild(inner);
    logWrap.appendChild(toggle);
    logWrap.appendChild(body);
    aiRow.appendChild(logWrap);
    scrollBottom();

    // Animate steps
    let i = 0;
    function activateStep() {
      if (i >= sc.steps.length) {
        // Done
        const summaryEl = document.getElementById('ts-log-summary');
        if (summaryEl) summaryEl.textContent = `Done in ${totalDur(sc.steps)} — ${sc.steps.length} steps`;
        // Auto-collapse after short pause
        setTimeout(() => {
          toggle.classList.remove('open');
          body.classList.remove('open');
        }, 800);
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 1200);
        return;
      }
      // Mark previous done
      if (i > 0) {
        const prev = document.getElementById(`ts-step-${i-1}`);
        if (prev) {
          prev.classList.remove('active');
          prev.innerHTML = stepRow(sc.steps[i-1], 'done', i-1);
        }
      }
      // Activate current
      const cur = document.getElementById(`ts-step-${i}`);
      if (cur) {
        cur.classList.add('active');
        cur.innerHTML = stepRow(sc.steps[i], 'active', i);
      }
      scrollBottom();
      i++;
      const delay = sc.steps[i-1].dur ? parseFloat(sc.steps[i-1].dur) * 900 + 500 : 1600;
      setTimeout(activateStep, delay);
    }
    activateStep();
  }

  function stepRow(step, state, idx) {
    let statusHtml = '';
    if (state === 'done') statusHtml = `<div class="ts-step-status ts-step-status-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></div>`;
    else if (state === 'active') statusHtml = `<div class="ts-step-status"><div class="ts-step-status-spin"></div></div>`;
    else statusHtml = `<div class="ts-step-status"><div class="ts-step-status-pending"></div></div>`;
    const dur = step.dur ? `<span class="ts-step-dur">${step.dur}</span>` : '';
    const expBtn = `<span class="ts-step-expand" onclick="toggleStepDetail(${idx})">details</span>`;
    return `
      ${statusHtml}
      <span class="ts-step-icon">${step.icon}</span>
      <span class="ts-step-label">${step.label}</span>
      ${dur}
      ${expBtn}`;
  }

  function toggleStepDetail(idx) {
    const el = document.getElementById(`ts-step-detail-${idx}`);
    if (el) el.classList.toggle('open');
  }

  // ════════════════════════════════════
  // VARIANT C — Ghost Cards
  // ════════════════════════════════════
  function startGhostCards(sc) {
    const msgs = document.getElementById('chat-messages');

    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    const ghostWrap = document.createElement('div');
    ghostWrap.className = 'ts-ghost';
    aiRow.appendChild(ghostWrap);

    let i = 0;
    function addCard() {
      if (i >= sc.steps.length) {
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 400);
        return;
      }
      const step = sc.steps[i];
      const card = makeGhostCard(step, i);
      ghostWrap.appendChild(card.card);
      ghostWrap.appendChild(card.detail);
      scrollBottom();
      i++;
      const delay = step.dur ? parseFloat(step.dur) * 800 + 300 : 1400;
      setTimeout(addCard, delay);
    }
    addCard();
  }

  function makeGhostCard(step, idx, prefix) {
    const pfx = prefix || 'ghost';
    const methodCls = step.method === 'GET' ? 'get' : step.method === 'POST' ? 'post' : 'tool';
    const dur = step.dur ? `<span class="ts-ghost-card-dur">${step.dur}</span>` : `<span class="ts-ghost-card-dur" style="color:var(--brand-purple)">running…</span>`;

    const card = document.createElement('div');
    card.className = 'ts-ghost-card animate-in';
    card.id = `${pfx}-card-${idx}`;
    card.innerHTML = `
      <span class="ts-ghost-card-icon">${step.icon}</span>
      <span class="ts-ghost-card-label">${step.label}</span>
      ${dur}
      <span class="ts-ghost-card-method ${methodCls}">${step.method}</span>
      <svg class="ts-ghost-card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>`;
    card.onclick = () => toggleGhost(idx, pfx);

    const detail = document.createElement('div');
    detail.className = 'ts-ghost-detail';
    detail.id = `${pfx}-detail-${idx}`;
    detail.innerHTML = `
      <div class="ts-ghost-detail-inner">
        <div class="ts-ghost-io-row">
          <div class="ts-ghost-io-label">Input / Query</div>
          <div class="ts-ghost-io-val">${step.detail.split('\n')[0]}</div>
        </div>
        <div class="ts-ghost-io-row">
          <div class="ts-ghost-io-label">Result</div>
          <div class="ts-ghost-io-val">${step.detail.split('\n').slice(1).join('<br>') || '—'}</div>
        </div>
      </div>`;

    return { card, detail };
  }

  function toggleGhost(idx, prefix) {
    const pfx = prefix || 'ghost';
    const card = document.getElementById(`${pfx}-card-${idx}`);
    const detail = document.getElementById(`${pfx}-detail-${idx}`);
    if (!card || !detail) return;
    const open = detail.classList.toggle('open');
    card.classList.toggle('expanded', open);
  }

  // ════════════════════════════════════
  // VARIANT D — Morphing Status Line
  // ════════════════════════════════════
  function startStatusLine(sc) {
    const msgs = document.getElementById('chat-messages');
    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    const wrap = document.createElement('div');
    wrap.className = 'ts-status-line';
    const textEl = document.createElement('span');
    textEl.className = 'ts-status-text';
    const arrowEl = document.createElement('span');
    arrowEl.className = 'ts-status-arrow';
    arrowEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
    wrap.appendChild(textEl);
    wrap.appendChild(arrowEl);
    wrap.style.cursor = 'pointer';
    aiRow.appendChild(wrap);
    scrollBottom();

    // Build log — open by default, closes when done
    const logWrap = document.createElement('div');
    logWrap.className = 'ts-status-log open';
    wrap.classList.add('log-open');
    wrap.onclick = () => {
      logWrap.classList.toggle('open');
      wrap.classList.toggle('log-open', logWrap.classList.contains('open'));
    };
    const logInner = document.createElement('div');
    logInner.className = 'ts-status-log-inner';
    logWrap.appendChild(logInner);
    aiRow.appendChild(logWrap);

    function morphText(newText, cb) {
      textEl.classList.add('fade');
      setTimeout(() => {
        textEl.textContent = newText;
        textEl.classList.remove('fade');
        if (cb) setTimeout(cb, 60);
      }, 350);
    }

    let i = 0;
    function runStep() {
      if (i >= sc.steps.length) {
        // Done — replace shimmer text + arrow with plain done button
        textEl.style.display = 'none';
        arrowEl.style.display = 'none';
        const doneBtn = document.createElement('button');
        doneBtn.className = 'ts-status-done';
        doneBtn.innerHTML = `${buildDoneSummary(sc)} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex-shrink:0"><path d="M9 18l6-6-6-6"/></svg>`;
        wrap.appendChild(doneBtn);
        logWrap.classList.remove('open');
        wrap.classList.remove('log-open');
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 350);
        return;
      }
      const step = sc.steps[i];
      appendDetailStep(step, logInner);
      morphText(stepCategory(step), () => { scrollBottom(); });
      i++;
      const delay = step.dur ? parseFloat(step.dur) * 3000 + 2500 : 5000;
      setTimeout(runStep, delay);
    }
    appendDetailStep(sc.steps[0], logInner);
    morphText(stepCategory(sc.steps[0]));
    i = 1;
    const firstDelay = sc.steps[0].dur ? parseFloat(sc.steps[0].dur) * 3000 + 2500 : 5000;
    setTimeout(runStep, firstDelay);
  }


  // ════════════════════════════════════
  // VARIANT E — Timeline Rail
  // ════════════════════════════════════
  function startTimelineRail(sc) {
    const msgs = document.getElementById('chat-messages');
    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    const rail = document.createElement('div');
    rail.className = 'ts-rail';

    // Track column (dots + lines)
    const track = document.createElement('div');
    track.className = 'ts-rail-track';
    sc.steps.forEach((step, idx) => {
      const dot = document.createElement('div');
      dot.className = 'ts-rail-dot' + (idx === 0 ? ' active' : '');
      dot.id = `rail-dot-${idx}`;
      track.appendChild(dot);
      if (idx < sc.steps.length - 1) {
        const line = document.createElement('div');
        line.className = 'ts-rail-line';
        line.id = `rail-line-${idx}`;
        track.appendChild(line);
      }
    });

    // Steps column
    const stepsCol = document.createElement('div');
    stepsCol.className = 'ts-rail-steps';
    sc.steps.forEach((step, idx) => {
      const s = document.createElement('div');
      s.className = 'ts-rail-step' + (idx === 0 ? ' active' : '');
      s.id = `rail-step-${idx}`;
      s.innerHTML = `
        <span class="ts-rail-step-icon">${step.icon}</span>
        <span class="ts-rail-step-text">${step.label}</span>
        ${step.dur ? `<span class="ts-rail-step-dur">${step.dur}</span>` : '<span class="ts-rail-step-dur" style="color:var(--brand-purple)">…</span>'}`;
      stepsCol.appendChild(s);
    });

    rail.appendChild(track);
    rail.appendChild(stepsCol);
    aiRow.appendChild(rail);
    scrollBottom();

    let i = 0;
    function advance() {
      if (i >= sc.steps.length) {
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 400);
        return;
      }
      // Mark previous done
      if (i > 0) {
        const prevDot = document.getElementById(`rail-dot-${i-1}`);
        const prevLine = document.getElementById(`rail-line-${i-1}`);
        const prevStep = document.getElementById(`rail-step-${i-1}`);
        if (prevDot) { prevDot.classList.remove('active'); prevDot.classList.add('done'); }
        if (prevLine) prevLine.classList.add('done');
        if (prevStep) { prevStep.classList.remove('active'); prevStep.classList.add('done'); }
      }
      // Activate current
      const dot = document.getElementById(`rail-dot-${i}`);
      const step = document.getElementById(`rail-step-${i}`);
      if (dot) dot.classList.add('active');
      if (step) step.classList.add('active');
      scrollBottom();
      i++;
      const delay = sc.steps[i-1].dur ? parseFloat(sc.steps[i-1].dur) * 900 + 400 : 1600;
      setTimeout(advance, delay);
    }
    advance();
  }


  // ════════════════════════════════════
  // VARIANT F — Source Chips
  // ════════════════════════════════════
  function startSourceChips(sc) {
    const msgs = document.getElementById('chat-messages');
    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    // Show a brief working indicator while steps run silently
    const workingEl = document.createElement('div');
    workingEl.className = 'ts-working-line';
    workingEl.innerHTML = `<div class="ts-working-spinner"></div> Researching…`;
    aiRow.appendChild(workingEl);
    scrollBottom();

    // Simulate all steps running, then reveal reply + chips
    const totalMs = sc.steps.reduce((a, s) => a + (s.dur ? parseFloat(s.dur) * 900 + 300 : 1400), 0);
    setTimeout(() => {
      // Remove working indicator
      workingEl.remove();

      // Build reply with inline [n] markers
      let replyHtml = mdLite(sc.reply);
      // Inject refs naturally at end of first sentence and after key facts
      const refCount = Math.min(sc.steps.length, 3);
      // Append refs inline at end of reply content naturally
      const sentences = replyHtml.split('. ');
      for (let r = 0; r < refCount && r < sentences.length; r++) {
        sentences[r] += ` <a class="ts-ref-tag" onclick="toggleSource(${r})" href="#">${r+1}</a>`;
      }
      replyHtml = sentences.join('. ');

      const replyEl = document.createElement('div');
      replyEl.className = 'ts-reply-with-refs animate-in';
      replyEl.innerHTML = replyHtml;
      aiRow.appendChild(replyEl);

      // Build source chips
      const sourcesWrap = document.createElement('div');
      sourcesWrap.id = 'ts-sources-wrap';

      const chipsRow = document.createElement('div');
      chipsRow.className = 'ts-sources-row';

      sc.steps.forEach((step, idx) => {
        const chip = document.createElement('div');
        chip.className = 'ts-source-chip';
        chip.id = `source-chip-${idx}`;
        chip.innerHTML = `<span class="ts-source-num">${idx+1}</span>${step.icon} ${step.label.length > 32 ? step.label.slice(0,32) + '…' : step.label}`;
        chip.onclick = () => toggleSource(idx);
        chipsRow.appendChild(chip);

        const detail = document.createElement('div');
        detail.className = 'ts-source-detail';
        detail.id = `source-detail-${idx}`;
        detail.innerHTML = `<div class="ts-source-detail-inner">${step.detail.replace(/\n/g,'<br>')}</div>`;
        chipsRow.appendChild(detail);
      });

      sourcesWrap.appendChild(chipsRow);
      aiRow.appendChild(sourcesWrap);
      scrollBottom();
    }, Math.min(totalMs, 3200));
  }

  function toggleSource(idx) {
    const chip = document.getElementById(`source-chip-${idx}`);
    const detail = document.getElementById(`source-detail-${idx}`);
    if (!chip || !detail) return;
    const open = detail.classList.toggle('open');
    chip.classList.toggle('expanded', open);
  }

  // ════════════════════════════════════
  // VARIANT I — Prose Narration
  // ════════════════════════════════════
  function startProseNarration(sc) {
    const msgs = document.getElementById('chat-messages');
    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    const proseEl = document.createElement('div');
    proseEl.className = 'ts-prose';
    const cursor = `<span class="ts-prose-cursor"></span>`;

    const narrations = buildNarration(sc.steps);
    let built = '';
    let i = 0;

    function updateProse() {
      built += (built ? ', then ' : 'I ') + narrations[i];
      proseEl.innerHTML = built + '…' + cursor;
      scrollBottom();
    }

    aiRow.appendChild(proseEl);
    updateProse();
    scrollBottom();

    function next() {
      i++;
      if (i >= narrations.length) {
        proseEl.innerHTML = built + '.';
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 400);
        return;
      }
      updateProse();
      const delay = sc.steps[i-1].dur ? parseFloat(sc.steps[i-1].dur) * 900 + 400 : 1500;
      setTimeout(next, delay);
    }
    const firstDelay = sc.steps[0].dur ? parseFloat(sc.steps[0].dur) * 900 + 400 : 1500;
    setTimeout(next, firstDelay);
  }

  let detailStepIdx = 0;

  function appendDetailStep(step, logInner) {
    // Group consecutive non-search steps with the same icon
    if (step.icon !== '🔍') {
      const last = logInner.lastElementChild;
      if (last && last.dataset.icon === step.icon) {
        let body = last.querySelector('.ts-detail-step-body');
        if (!body) {
          body = document.createElement('div');
          body.className = 'ts-detail-step-body';
          last.appendChild(body);
        }
        const sublabel = document.createElement('div');
        sublabel.className = 'ts-detail-step-body-line ts-detail-step-body-sublabel';
        sublabel.textContent = step.label;
        body.appendChild(sublabel);
        if (step.detail) {
          step.detail.split('\n').forEach(line => {
            if (!line.trim()) return;
            const lineEl = document.createElement('div');
            lineEl.className = 'ts-detail-step-body-line';
            lineEl.textContent = line;
            body.appendChild(lineEl);
          });
        }
        return;
      }
    }
    logInner.appendChild(makeDetailStep(step));
  }

  function makeDetailStep(step) {
    detailStepIdx++;
    const el = document.createElement('div');
    el.className = 'ts-detail-step';
    el.dataset.icon = step.icon;

    if (step.icon === '🔍') {
      // Figma-style: query header + bordered results box, auto-expanded
      const query = extractQueries(step)[0] || step.label;
      const results = generateResults(step);
      const section = document.createElement('div');
      section.className = 'ts-search-section';

      const header = document.createElement('div');
      header.className = 'ts-search-query-header';
      header.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <span class="ts-search-query-text">${query}</span>
        <span class="ts-search-query-count">${results.length} results</span>`;

      const box = document.createElement('div');
      box.className = 'ts-search-results-box';

      results.forEach(r => {
        const row = document.createElement('div');
        row.className = 'ts-search-result-row';
        row.innerHTML = `<img class="ts-search-result-favicon" src="https://www.google.com/s2/favicons?domain=${r.domain}&sz=32" alt="" /><span class="ts-search-result-title">${r.title}</span><span class="ts-search-result-domain">${r.domain}</span>`;
        box.appendChild(row);
      });

      section.appendChild(header);
      section.appendChild(box);
      el.appendChild(section);
    } else {
      // Non-search: flat header + body, no chevron
      const header = document.createElement('div');
      header.className = 'ts-detail-step-header';
      header.innerHTML = `<div class="ts-detail-step-icon">${stepSvgIcon(step)}</div><span class="ts-detail-step-label">${step.label}</span>`;
      el.appendChild(header);

      if (step.detail) {
        const body = document.createElement('div');
        body.className = 'ts-detail-step-body';
        step.detail.split('\n').forEach(line => {
          if (!line.trim()) return;
          const lineEl = document.createElement('div');
          lineEl.className = 'ts-detail-step-body-line';
          lineEl.textContent = line;
          body.appendChild(lineEl);
        });
        el.appendChild(body);
      }
    }

    return el;
  }

  function stepSvgIcon(step) {
    if (step.icon === '🔍') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>`;
    if (step.icon === '📄') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
    if (step.icon === '🔑') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>`;
    if (step.icon === '📊') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`;
    if (step.icon === '💰') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
    if (step.icon === '✍️' || step.icon === '📝') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>`;
  }

  function extractQueries(step) {
    const matches = step.label.match(/"([^"]+)"/g);
    if (matches) return matches.map(m => m.replace(/"/g, ''));
    if (step.icon === '🔍') return [step.label.replace(/^Searched\s*/i, '').replace(/^"(.*)"$/, '$1')];
    if (step.icon === '📄') return [step.label.replace(/^Read\s*/i, '')];
    return [step.label];
  }

  const FAKE_RESULTS = {
    '🔍': [
      { title: 'Meta Ads Performance Benchmarks Q1 2025', domain: 'marketingland.com', color: '#1877f2', letter: 'M' },

  function generateResults(step) {
    return FAKE_RESULTS[step.icon] || [];
  }

  function stepCategory(step) {
    if (step.icon === '🔍') return 'Searching the web';
    if (step.icon === '📄') return 'Reading article';
    if (step.icon === '🔑') return 'Authenticating';
    if (step.icon === '📊') return 'Fetching data';
    if (step.icon === '💰') return 'Checking budgets';
    if (step.icon === '✍️' || step.icon === '📝') return 'Writing response';
    return 'Working';
  }

  function buildDoneSummary(sc) {
    // Try to extract the topic from a search query first (text inside quotes)
    for (const step of sc.steps) {
      const match = step.label.match(/"([^"]+)"/);
      if (match) {
        return toTopicTitle(match[1]);
      }
    }
    // Fall back to deriving a title from the query itself
    if (sc.query) return toTopicTitle(sc.query);
    return 'Research completed';
  }

  function toTopicTitle(text) {
    // Strip question words and trailing punctuation, trim to ~40 chars
    const cleaned = text
      .replace(/^(what are|what is|how do i|show me|pull my|give me|research|audit|find|get)\s+/i, '')
      .replace(/[?!.]$/, '')
      .trim();
    const capped = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
    return capped;
  }

  function buildNarration(steps) {
    return steps.map(s => {
      if (s.icon === '🔍') return `searched the web for "${s.label.replace('Searched ','').replace(/"/g,'')}"`;
      if (s.icon === '📄') return `read ${s.label.replace('Read ','').split('/').pop() || 'a source'}`;
      if (s.icon === '🔑') return `authenticated with the API`;
      if (s.icon === '📊') return `fetched your campaign data`;
      if (s.icon === '💰') return `checked budget utilization`;
      if (s.icon === '✍️') return `drafted the content`;
      if (s.icon === '📝') return `wrote the recommendations`;
      return `ran ${s.label.toLowerCase()}`;
    });
  }
