<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexos.ai — Thinking Steps</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

    :root {
      --background: 0 0% 100%;
      --foreground: 258 6% 15%;
      --muted: 240 5% 97%;
      --muted-foreground: 258 4% 45%;
      --border: 240 6% 90%;
      --primary: 252 100% 64%;
      --accent: 252 100% 96%;
      --radius: 0.5rem;

      --bg-primary:         hsl(var(--muted));
      --bg-secondary:       hsl(var(--background));
      --bg-tertiary:        hsl(240 4% 50% / 0.10);
      --border-secondary:   hsl(var(--border));
      --text-primary:       hsl(var(--foreground));
      --text-secondary:     hsl(300 1% 27%);
      --text-tertiary:      hsl(var(--muted-foreground));
      --text-placeholder:   hsl(var(--muted-foreground));
      --brand-purple:       hsl(var(--primary));
      --brand-purple-light: hsl(var(--accent));
      --accent-color:       hsl(var(--primary));

      --radius-xs:   calc(var(--radius) * 0.5);
      --radius-sm:   var(--radius);
      --radius-md:   calc(var(--radius) * 2);
      --radius-full: 9999px;

      --shadow-sm: 0 1px 3px hsl(252 100% 14% / 0.10), 0 1px 2px hsl(252 100% 14% / 0.05);
      --shadow-lg: 0 8px 15px hsl(252 100% 14% / 0.06), 0 4px 7px hsl(252 100% 14% / 0.03);
      --transition: .15s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── Layout ────────────────────────── */
    .body-layout { display: flex; flex: 1; overflow: hidden; }

    /* ─── Sidebar (minimal stub) ────────── */
    .sidebar {
      width: 264px; background: var(--bg-primary);
      display: flex; flex-direction: column;
      flex-shrink: 0; overflow: hidden;
      border-right: 1px solid var(--border-secondary);
    }
    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 10px 10px 16px; flex-shrink: 0;
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; flex: 1;
    }
    .logo-emblem {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--text-primary);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-emblem svg { width: 14px; height: 14px; color: white; }
    .logo-name {
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 16px;
      color: var(--text-primary); letter-spacing: -0.3px;
    }
    .logo-name sup { color: var(--accent-color); font-size: 11px; font-weight: 500; }
    .icon-btn {
      width: 32px; height: 32px; border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; background: transparent; border: none;
      color: var(--text-tertiary); transition: background var(--transition), color var(--transition);
    }
    .icon-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .icon-btn svg { width: 20px; height: 20px; }
    .sidebar-footer {
      margin-top: auto;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; flex-shrink: 0; border-top: 1px solid var(--border-secondary);
    }
    .sidebar-avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: #e0d8ff; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: var(--accent-color); cursor: pointer;
    }
    .sidebar-email { font-size: 13px; color: var(--text-secondary); }

    /* ─── Main ───────────────────────────── */
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-thread {
      flex: 1; overflow-y: auto; padding: 40px 0 0;
      display: flex; flex-direction: column;
    }
    .chat-thread::-webkit-scrollbar { width: 4px; }
    .chat-thread::-webkit-scrollbar-thumb { background: var(--border-secondary); border-radius: 2px; }
    .chat-messages {
      width: 100%; max-width: 760px; margin: 0 auto;
      padding: 0 24px 32px; display: flex; flex-direction: column; gap: 24px;
    }

    /* ─── Messages ───────────────────────── */
    .msg-row.user { display: flex; justify-content: flex-end; }
    .msg-bubble.user {
      max-width: 68%; background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      border-radius: 16px 16px 4px 16px;
      padding: 12px 16px; font-size: 15px; line-height: 24px;
    }
    .msg-row.ai { display: flex; flex-direction: column; gap: 8px; }
    .ai-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 500; color: var(--text-tertiary);
    }
    .ai-badge-icon {
      width: 18px; height: 18px; border-radius: 4px; background: var(--bg-tertiary);
      display: flex; align-items: center; justify-content: center;
    }
    .ai-badge-icon svg { width: 11px; height: 11px; color: var(--text-tertiary); }
    .msg-bubble.ai { font-size: 15px; line-height: 24px; color: var(--text-primary); }

    /* ─── Prompt ─────────────────────────── */
    .prompt-wrap {
      width: 100%; max-width: 760px; padding: 0 24px 24px; margin: 0 auto;
    }
    .prompt-box {
      position: relative; background: #fff;
      border: 1px solid var(--border-secondary); border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
    }
    .prompt-textarea-row { padding: 14px 16px 0; }
    .prompt-textarea {
      width: 100%; border: none; outline: none; resize: none;
      font-family: 'Inter', sans-serif; font-size: 15px; line-height: 24px;
      color: var(--text-primary); background: transparent; max-height: 200px;
    }
    .prompt-textarea::placeholder { color: var(--text-placeholder); }
    .prompt-actions {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px 12px;
    }
    .prompt-actions-left { display: flex; align-items: center; gap: 2px; }
    .prompt-actions-right { display: flex; align-items: center; gap: 4px; }
    .prompt-btn {
      display: inline-flex; align-items: center; gap: 5px;
      height: 32px; padding: 0 10px; border-radius: var(--radius-sm);
      border: none; background: transparent; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      transition: background var(--transition), color var(--transition);
    }
    .prompt-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .prompt-btn svg { width: 16px; height: 16px; }
    .send-btn {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      background: var(--brand-purple); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity var(--transition);
    }
    .send-btn:hover { opacity: .88; }
    .send-btn svg { width: 16px; height: 16px; color: #fff; }

    /* ─── Version switcher ─────────────────── */
    .version-switcher {
      position: fixed; bottom: 20px; left: 20px;
      z-index: 9999; font-family: 'Inter', sans-serif;
    }
    .version-trigger {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; background: var(--bg-secondary);
      border: 1px solid var(--border-secondary); border-radius: var(--radius-full);
      box-shadow: 0 2px 8px rgba(18,0,69,.08); cursor: pointer; user-select: none;
    }
    .version-trigger-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .version-trigger-desc { font-size: 12px; color: var(--text-tertiary); }
    .version-trigger svg { width: 14px; height: 14px; color: var(--text-tertiary); transition: transform var(--transition); }
    .version-switcher.open .version-trigger svg { transform: rotate(180deg); }
    .version-dropdown {
      position: absolute; bottom: calc(100% + 6px); left: 0;
      background: var(--bg-secondary); border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 24px rgba(18,0,69,.10), 0 2px 8px rgba(18,0,69,.06);
      padding: 4px; min-width: 200px; display: none;
    }
    .version-switcher.open .version-dropdown { display: block; }
    .version-option {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 6px; cursor: pointer;
      text-decoration: none; transition: background var(--transition);
    }
    .version-option:hover { background: var(--bg-primary); }
    .version-option.current { background: var(--bg-primary); }
    .version-option-label { font-size: 13px; font-weight: 600; color: var(--text-primary); min-width: 32px; }
    .version-option-desc { font-size: 13px; color: var(--text-secondary); }
    .version-option-check { margin-left: auto; width: 14px; height: 14px; color: var(--accent-color); opacity: 0; }
    .version-option.current .version-option-check { opacity: 1; }


    /* ════════════════════════════════════════════════════════════
       VARIANT A — Pill Stream
       Inspired by Perplexity. Horizontal chips, one at a time.
       Done chips collapse; active chip pulses. Whole row
       compresses to a single "Done" chip after completion.
       ════════════════════════════════════════════════════════════ */
    .ts-pill-stream {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      min-height: 32px;
    }
    .ts-pill {
      display: inline-flex; align-items: center; gap: 6px;
      height: 28px; padding: 0 10px;
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-full);
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      white-space: nowrap;
      transition: all .25s ease;
      overflow: hidden;
    }
    .ts-pill svg { width: 14px; height: 14px; flex-shrink: 0; }
    .ts-pill.active {
      background: var(--brand-purple-light);
      border-color: hsl(252 100% 64% / .3);
      color: var(--brand-purple);
    }
    .ts-pill.active .ts-pill-icon { animation: pill-spin 1.2s linear infinite; }
    @keyframes pill-spin { to { transform: rotate(360deg); } }
    .ts-pill.done {
      background: var(--bg-primary);
      border-color: var(--border-secondary);
      color: var(--text-tertiary);
    }
    .ts-pill.done .ts-pill-label { display: none; }
    .ts-pill.done { padding: 0 8px; }
    .ts-pill.summary {
      background: var(--bg-primary);
      border-color: var(--border-secondary);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .ts-pill.summary:hover { border-color: var(--brand-purple); color: var(--text-primary); }
    .ts-pill-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: hsl(142 70% 45%); flex-shrink: 0;
    }


    /* ════════════════════════════════════════════════════════════
       VARIANT B — Activity Log
       Manus-style collapsible vertical log. Expanding reveals
       steps with icon + label + duration. Collapses to one line.
       ════════════════════════════════════════════════════════════ */
    .ts-log-wrap { display: flex; flex-direction: column; gap: 0; }
    .ts-log-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer; padding: 0;
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      transition: color var(--transition); width: fit-content;
    }
    .ts-log-toggle:hover { color: var(--text-primary); }
    .ts-log-toggle-icon {
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px; background: var(--bg-tertiary); flex-shrink: 0;
    }
    .ts-log-toggle-icon svg { width: 12px; height: 12px; transition: transform .2s; }
    .ts-log-toggle.open .ts-log-toggle-icon svg { transform: rotate(180deg); }
    .ts-log-toggle-spinner {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid hsl(252 100% 64% / .25);
      border-top-color: var(--brand-purple);
      animation: log-spin .8s linear infinite; flex-shrink: 0;
    }
    @keyframes log-spin { to { transform: rotate(360deg); } }

    .ts-log-body {
      overflow: hidden; max-height: 0;
      transition: max-height .3s ease, opacity .2s ease, margin .2s ease;
      opacity: 0; margin-top: 0;
    }
    .ts-log-body.open { max-height: 400px; opacity: 1; margin-top: 10px; }

    .ts-log-inner {
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .ts-step {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border-secondary);
      font-size: 13px; color: var(--text-secondary);
    }
    .ts-step:last-child { border-bottom: none; }
    .ts-step.active { background: hsl(252 100% 64% / .04); }
    .ts-step-status { flex-shrink: 0; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
    .ts-step-status-check svg { width: 14px; height: 14px; color: hsl(142 70% 45%); }
    .ts-step-status-spin {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid hsl(252 100% 64% / .25);
      border-top-color: var(--brand-purple);
      animation: log-spin .8s linear infinite;
    }
    .ts-step-status-pending { width: 6px; height: 6px; border-radius: 50%; background: var(--border-secondary); margin: auto; }
    .ts-step-icon { font-size: 14px; flex-shrink: 0; }
    .ts-step-label { flex: 1; line-height: 20px; }
    .ts-step.active .ts-step-label { color: var(--text-primary); font-weight: 500; }
    .ts-step-dur { font-size: 12px; color: var(--text-tertiary); flex-shrink: 0; }
    .ts-step-expand {
      font-size: 11px; color: var(--text-tertiary); cursor: pointer;
      padding: 2px 6px; border-radius: 4px; transition: background var(--transition), color var(--transition);
      border: 1px solid var(--border-secondary); background: var(--bg-secondary);
    }
    .ts-step-expand:hover { color: var(--text-primary); background: var(--bg-tertiary); }

    .ts-step-detail {
      overflow: hidden; max-height: 0;
      transition: max-height .2s ease, opacity .15s ease;
      opacity: 0;
    }
    .ts-step-detail.open { max-height: 120px; opacity: 1; }
    .ts-step-detail-inner {
      margin: 0 14px 10px 40px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-secondary);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: 'Inter', sans-serif; font-size: 12px;
      color: var(--text-tertiary); line-height: 18px;
    }


    /* ════════════════════════════════════════════════════════════
       VARIANT C — Ghost Cards (inline, low-weight)
       Each tool call is a quiet separator card between messages.
       Expands on click to show I/O.
       ════════════════════════════════════════════════════════════ */
    .ts-ghost {
      width: 100%;
      display: flex; flex-direction: column; gap: 2px;
    }
    .ts-ghost-card {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      border: 1px dashed hsl(240 6% 88%);
      background: transparent;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      font-size: 13px; color: var(--text-tertiary);
    }
    .ts-ghost-card:hover {
      background: hsl(240 4% 50% / .05);
      border-color: hsl(240 6% 80%);
      color: var(--text-secondary);
    }
    .ts-ghost-card.expanded {
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      color: var(--text-secondary);
    }
    .ts-ghost-card-icon { font-size: 14px; flex-shrink: 0; }
    .ts-ghost-card-label { flex: 1; font-weight: 500; }
    .ts-ghost-card-method {
      font-size: 11px; font-weight: 600; letter-spacing: .4px;
      padding: 2px 6px; border-radius: 3px;
      background: hsl(240 6% 92%); color: var(--text-tertiary);
    }
    .ts-ghost-card-method.get { background: hsl(142 60% 92%); color: hsl(142 60% 28%); }
    .ts-ghost-card-method.post { background: hsl(210 80% 92%); color: hsl(210 80% 32%); }
    .ts-ghost-card-method.tool { background: var(--brand-purple-light); color: var(--brand-purple); }
    .ts-ghost-card-chevron { width: 14px; height: 14px; transition: transform .2s; flex-shrink: 0; }
    .ts-ghost-card.expanded .ts-ghost-card-chevron { transform: rotate(180deg); }
    .ts-ghost-card-dur { font-size: 12px; color: var(--text-tertiary); flex-shrink: 0; }

    .ts-ghost-detail {
      overflow: hidden; max-height: 0;
      transition: max-height .25s ease, opacity .2s ease;
      opacity: 0;
    }
    .ts-ghost-detail.open { max-height: 220px; opacity: 1; }
    .ts-ghost-detail-inner {
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary); border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .ts-ghost-io-row { display: flex; flex-direction: column; gap: 4px; }
    .ts-ghost-io-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text-tertiary); }
    .ts-ghost-io-val {
      font-size: 12px; font-family: 'Inter', sans-serif; line-height: 18px;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      border: 1px solid var(--border-secondary);
      border-radius: 6px; padding: 6px 8px;
    }

    /* Animated in */
    @keyframes msg-in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .animate-in { animation: msg-in .2s ease; }

    /* Typing dots */
    .typing-indicator { display: flex; align-items: center; gap: 4px; height: 24px; }
    .typing-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary);
      animation: td .9s ease infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: .15s; }
    .typing-dot:nth-child(3) { animation-delay: .3s; }
    @keyframes td { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-4px);opacity:1} }

    /* Scenario picker strip */
    .scenario-strip {
      width: 100%; max-width: 760px; margin: 0 auto;
      padding: 0 24px 12px;
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    .scenario-label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-right: 4px; }
    .scenario-btn {
      height: 28px; padding: 0 12px;
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-full); background: var(--bg-secondary);
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; transition: all var(--transition); white-space: nowrap;
    }
    .scenario-btn:hover { border-color: var(--brand-purple); color: var(--brand-purple); }
    .scenario-btn.active { background: var(--brand-purple-light); border-color: hsl(252 100% 64% / .4); color: var(--brand-purple); }

    /* Variant toggle */
    .variant-strip {
      width: 100%; max-width: 760px; margin: 0 auto;
      padding: 0 24px 4px;
      display: flex; gap: 4px; align-items: center;
    }
    .variant-label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-right: 4px; }
    .variant-tab {
      height: 30px; padding: 0 12px;
      border-radius: var(--radius-sm); border: none;
      background: transparent;
      font-size: 13px; font-weight: 500; color: var(--text-tertiary);
      cursor: pointer; transition: all var(--transition);
    }
    .variant-tab:hover { background: var(--bg-tertiary); color: var(--text-secondary); }
    .variant-tab.active {
      background: var(--brand-purple-light);
      color: var(--brand-purple);
    }
    .variant-divider { height: 1px; background: var(--border-secondary); width: 100%; max-width: 760px; margin: 0 auto 16px; }

    /* ════════════════════════════════════════════════════════════
       VARIANT D — Morphing Status Line
       Single line that updates in-place as each step finishes.
       Fades between states. Collapses to "Done in Xs ›" link.
       ════════════════════════════════════════════════════════════ */
    .ts-status-line {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text-secondary);
      min-height: 22px;
    }
    .ts-status-spinner {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid hsl(252 100% 64% / .25);
      border-top-color: var(--brand-purple);
      animation: log-spin .8s linear infinite;
    }
    .ts-status-text {
      transition: opacity .18s ease;
    }
    .ts-status-text.fade { opacity: 0; }
    .ts-status-done {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 500; color: var(--text-tertiary);
      cursor: pointer; border: none; background: none; padding: 0;
      transition: color var(--transition);
    }
    .ts-status-done:hover { color: var(--text-primary); }
    .ts-status-done-check {
      width: 14px; height: 14px;
      background: hsl(142 70% 45%); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ts-status-done-check svg { width: 8px; height: 8px; color: #fff; }

    .ts-status-log {
      overflow: hidden; max-height: 0;
      transition: max-height .25s ease, opacity .2s ease, margin .15s ease;
      opacity: 0; margin-top: 0;
    }
    .ts-status-log.open { max-height: 300px; opacity: 1; margin-top: 8px; }
    .ts-status-log-inner {
      background: var(--bg-primary); border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm); overflow: hidden;
    }
    .ts-status-log-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; border-bottom: 1px solid var(--border-secondary);
      font-size: 13px; color: var(--text-secondary);
    }
    .ts-status-log-row:last-child { border-bottom: none; }
    .ts-status-log-check { width: 13px; height: 13px; color: hsl(142 70% 40%); flex-shrink: 0; }
    .ts-status-log-icon { font-size: 13px; flex-shrink: 0; }
    .ts-status-log-label { flex: 1; }
    .ts-status-log-dur { font-size: 12px; color: var(--text-tertiary); }


    /* ════════════════════════════════════════════════════════════
       VARIANT E — Timeline Rail
       Thin vertical track with step dots on the left.
       Active dot pulses purple. Done = filled green. Hover = tooltip.
       ════════════════════════════════════════════════════════════ */
    .ts-rail {
      display: flex; gap: 14px; align-items: flex-start;
    }
    .ts-rail-track {
      display: flex; flex-direction: column; align-items: center;
      flex-shrink: 0; padding-top: 3px;
    }
    .ts-rail-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      background: var(--border-secondary); position: relative; cursor: default;
      transition: background .2s ease, box-shadow .2s ease;
    }
    .ts-rail-dot.done { background: hsl(142 70% 45%); }
    .ts-rail-dot.active {
      background: var(--brand-purple);
      box-shadow: 0 0 0 3px hsl(252 100% 64% / .2);
      animation: rail-pulse 1.4s ease infinite;
    }
    @keyframes rail-pulse {
      0%,100% { box-shadow: 0 0 0 3px hsl(252 100% 64% / .2); }
      50% { box-shadow: 0 0 0 6px hsl(252 100% 64% / .08); }
    }
    .ts-rail-line {
      width: 2px; flex: 1; min-height: 20px;
      background: var(--border-secondary);
      margin: 3px 0;
    }
    .ts-rail-line.done { background: hsl(142 70% 45% / .4); }

    .ts-rail-steps { display: flex; flex-direction: column; gap: 0; flex: 1; }
    .ts-rail-step {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 0 0 20px 0; font-size: 13px; line-height: 18px;
      color: var(--text-tertiary); position: relative;
    }
    .ts-rail-step:last-child { padding-bottom: 0; }
    .ts-rail-step.active { color: var(--text-primary); font-weight: 500; }
    .ts-rail-step.done { color: var(--text-secondary); }
    .ts-rail-step-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }
    .ts-rail-step-text { flex: 1; }
    .ts-rail-step-dur { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; margin-top: 2px; }


    /* ════════════════════════════════════════════════════════════
       VARIANT F — Source Chips
       Steps run silently. Reply appears with [n] footnotes.
       Below reply: a row of expandable reference cards.
       ════════════════════════════════════════════════════════════ */
    .ts-working-line {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-tertiary);
    }
    .ts-working-spinner {
      width: 11px; height: 11px; border-radius: 50%;
      border: 2px solid hsl(252 100% 64% / .2);
      border-top-color: var(--brand-purple);
      animation: log-spin .8s linear infinite; flex-shrink: 0;
    }

    .ts-reply-with-refs { font-size: 15px; line-height: 24px; color: var(--text-primary); }
    .ts-ref-tag {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 3px;
      background: var(--brand-purple-light); color: var(--brand-purple);
      font-size: 10px; font-weight: 700; line-height: 1;
      cursor: pointer; margin: 0 1px; vertical-align: middle;
      transition: background var(--transition);
      text-decoration: none;
    }
    .ts-ref-tag:hover { background: hsl(252 100% 64% / .2); }

    .ts-sources-row {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;
    }
    .ts-source-chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 28px; padding: 0 10px;
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      font-size: 12px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; white-space: nowrap;
      transition: border-color var(--transition), background var(--transition);
    }
    .ts-source-chip:hover { border-color: var(--brand-purple); background: var(--brand-purple-light); color: var(--brand-purple); }
    .ts-source-chip.expanded { border-color: var(--brand-purple); background: var(--brand-purple-light); color: var(--brand-purple); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
    .ts-source-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 3px;
      background: var(--brand-purple); color: #fff;
      font-size: 9px; font-weight: 700; flex-shrink: 0;
    }
    .ts-source-detail {
      overflow: hidden; max-height: 0;
      transition: max-height .25s ease, opacity .2s ease;
      opacity: 0;
    }
    .ts-source-detail.open { max-height: 120px; opacity: 1; }
    .ts-source-detail-inner {
      background: var(--brand-purple-light);
      border: 1px solid hsl(252 100% 64% / .3); border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      padding: 8px 12px;
      font-size: 12px; color: hsl(252 30% 35%); line-height: 18px;
    }


    /* ════════════════════════════════════════════════════════════
       VARIANT G — Step-before-reply Card
       Single collapsed card sits above reply text.
       Loading during processing, shows summary after done.
       Click to expand a clean step list.
       ════════════════════════════════════════════════════════════ */
    .ts-receipt {
      display: flex; flex-direction: column;
    }
    .ts-receipt-header {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px;
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; user-select: none;
      transition: border-color var(--transition), border-radius var(--transition);
    }
    .ts-receipt-header:hover { border-color: hsl(252 100% 64% / .4); }
    .ts-receipt-header.expanded { border-radius: var(--radius-sm) var(--radius-sm) 0 0; border-color: var(--border-secondary); }
    .ts-receipt-icon {
      width: 20px; height: 20px; border-radius: 5px;
      background: var(--brand-purple-light);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ts-receipt-icon svg { width: 11px; height: 11px; color: var(--brand-purple); }
    .ts-receipt-icon-spin {
      width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid hsl(252 100% 64% / .2);
      border-top-color: var(--brand-purple);
      animation: log-spin .8s linear infinite;
    }
    .ts-receipt-label { flex: 1; }
    .ts-receipt-meta { font-size: 12px; color: var(--text-tertiary); font-weight: 400; }
    .ts-receipt-chevron { width: 14px; height: 14px; color: var(--text-tertiary); transition: transform .2s; flex-shrink: 0; }
    .ts-receipt-header.expanded .ts-receipt-chevron { transform: rotate(180deg); }

    .ts-receipt-body {
      overflow: hidden; max-height: 0;
      transition: max-height .3s ease, opacity .2s ease;
      opacity: 0;
    }
    .ts-receipt-body.open { max-height: 400px; opacity: 1; }
    .ts-receipt-body-inner {
      background: var(--bg-primary);
      border: 1px solid var(--border-secondary); border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      overflow: hidden;
    }
    .ts-receipt-step {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-bottom: 1px solid var(--border-secondary);
      font-size: 13px; color: var(--text-secondary);
    }
    .ts-receipt-step:last-child { border-bottom: none; }
    .ts-receipt-step-check { width: 14px; height: 14px; color: hsl(142 70% 40%); flex-shrink: 0; }
    .ts-receipt-step-icon { font-size: 13px; flex-shrink: 0; }
    .ts-receipt-step-label { flex: 1; }
    .ts-receipt-step-dur { font-size: 12px; color: var(--text-tertiary); }
  </style>
</head>
<body>
<div class="body-layout">
  <!-- Sidebar stub -->
  <aside class="sidebar">
    <div class="sidebar-header">

        <div class="logo-emblem">

          </svg>
        </div>
        <span class="logo-name">nexos<sup>AI</sup></span>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>

  <!-- Main -->

        <button class="variant-tab active" onclick="switchVariant('a', this)">A — Pill Stream</button>
        <button class="variant-tab" onclick="switchVariant('b', this)">B — Activity Log</button>
        <button class="variant-tab" onclick="switchVariant('c', this)">C — Ghost Cards</button>
        <button class="variant-tab" onclick="switchVariant('d', this)">D — Status Line</button>
        <button class="variant-tab" onclick="switchVariant('e', this)">E — Timeline Rail</button>

              History

<!-- Version switcher -->

      <span class="version-option-label">TS</span>

<script>
  // ─── State ───────────────────────────────────────────────────
  let currentVariant = 'a';
  let currentScenario = 'search';

  const SCENARIOS = {
    search: {
      query: 'What are the best performing ad formats on Meta in Q1 2025?',
      steps: [
        { icon: '🔍', label: 'Searched "Meta ad formats Q1 2025 performance"', dur: '0.4s', method: 'GET', detail: 'Query: Meta ad formats Q1 2025\nReturned 12 results from web index' },
        { icon: '📄', label: 'Read marketingland.com/meta-ads-benchmarks', dur: '1.1s', method: 'GET', detail: 'Extracted: CTR benchmarks, CPM data, format breakdown by vertical' },
        { icon: '📄', label: 'Read socialmediatoday.com/ad-formats-2025', dur: '0.8s', method: 'GET', detail: 'Extracted: Reels vs Stories performance comparison, carousel stats' },
      ],
      reply: 'Based on the latest benchmarks, **Reels ads** are outperforming static formats with an average CTR of 1.8% vs 0.9% for feed images. Carousel formats remain strong for e-commerce with a 2.3x higher conversion rate compared to single-image ads. Stories still deliver low CPMs for awareness campaigns.'
    },
    api: {
      query: 'Pull my Google Ads campaigns and show me which ones are over budget',
      steps: [
        { icon: '🔑', label: 'Authenticated with Google Ads API', dur: '0.2s', method: 'POST', detail: 'OAuth2 token refreshed\nScope: adwords.readonly' },
        { icon: '📊', label: 'google_ads.campaigns.list()', dur: '1.4s', method: 'TOOL', detail: 'customer_id: 123-456-7890\nReturned 14 campaigns' },
        { icon: '💰', label: 'google_ads.budgets.get(campaign_ids)', dur: '0.9s', method: 'TOOL', detail: 'Fetched spend vs budget for all 14 campaigns\n3 campaigns flagged over 90% budget utilization' },
      ],
      reply: 'Found **3 campaigns over budget** (>90% utilized):\n\n1. **Summer Sale — Search** · $4,820 / $5,000 (96%)\n2. **Brand Keywords — EU** · $2,100 / $2,200 (95%)\n3. **Retargeting — Mobile** · $890 / $900 (99%)\n\nWant me to pause any of these or adjust daily caps?'
    },
    multi: {
      query: 'Research competitors and write a positioning brief for our new SEO product',
      steps: [
        { icon: '🔍', label: 'Searched "SEO platform competitors 2025"', dur: '0.5s', method: 'GET', detail: 'Query: SEO platforms comparison 2025\nFound: Semrush, Ahrefs, Moz, Screaming Frog, Surfer SEO' },
        { icon: '🔍', label: 'Searched "Semrush vs Ahrefs pricing features"', dur: '0.3s', method: 'GET', detail: 'Compared feature sets, pricing tiers, and market positioning' },
        { icon: '📄', label: 'Read g2.com/categories/seo-software reviews', dur: '1.2s', method: 'GET', detail: 'Extracted top pain points from 340 reviews:\n— too expensive, steep learning curve, no AI automation' },
        { icon: '✍️', label: 'Generating positioning brief…', dur: null, method: 'TOOL', detail: 'Writing 4-section brief: market overview, gaps, positioning, messaging' },
      ],
      reply: 'Here\'s your SEO positioning brief...\n\n**Market gap:** Existing tools are expensive and technical. No clear AI-native player owns the "SMB + AI" niche.\n\n**Positioning:** "The only SEO platform built for marketers, not SEOs" — emphasizes AI automation, plain-English insights, and affordable pricing starting at $29/mo.'
    },
    long: {
      query: 'Audit our entire ad account and give me a full optimization plan',
      steps: [
        { icon: '🔑', label: 'Authenticated with Google Ads & Meta Ads', dur: '0.3s', method: 'POST', detail: 'Google Ads: OK\nMeta Business Suite: OK' },
        { icon: '📊', label: 'Fetched 90-day performance data', dur: '2.1s', method: 'TOOL', detail: '6 campaigns, 28 ad sets, 142 ads\n90-day window, all metrics' },
        { icon: '🔍', label: 'Analyzed keyword quality scores', dur: '1.4s', method: 'TOOL', detail: 'Average QS: 5.8 / 10\n12 keywords below QS 4 identified' },
        { icon: '🔍', label: 'Checked audience overlap', dur: '0.9s', method: 'TOOL', detail: '3 ad set pairs with >70% audience overlap\nEstimated budget waste: $340/mo' },
        { icon: '📝', label: 'Writing optimization recommendations', dur: '1.8s', method: 'TOOL', detail: 'Generating 18 prioritized recommendations across bidding, creative, targeting' },
        { icon: '📄', label: 'Formatting final report', dur: '0.4s', method: 'TOOL', detail: 'Structured as: Quick wins, Medium-term, Strategic' },
      ],
      reply: 'Full audit complete. Found **$1,240/mo in recoverable waste** across 3 areas:\n\n**Quick wins (this week):** Pause 12 low-QS keywords, fix 3 ad sets with audience overlap.\n\n**Medium-term:** Restructure Shopping campaigns into Performance Max, refresh 8 stale creatives.\n\n**Strategic:** Test broad match + Smart Bidding on your top 3 campaigns.'
    }
  };

  // ─── Scenario + Variant switching ────────────────────────────
  function switchVariant(v, btn) {
    currentVariant = v;
    document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    clearMessages();
    runScenarioAuto();
  }

  function runScenario(s, btn) {
    currentScenario = s;
    document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    clearMessages();
    runScenarioAuto();
  }

  function clearMessages() {
    document.getElementById('chat-messages').innerHTML = '';
  }

  function runScenarioAuto() {
    const sc = SCENARIOS[currentScenario];
    addUserMsg(sc.query);
    setTimeout(() => startThinkingSequence(sc), 600);
  }

  function addUserMsg(text) {
    const msgs = document.getElementById('chat-messages');
    const el = document.createElement('div');
    el.className = 'msg-row user animate-in';
    el.innerHTML = `<div class="msg-bubble user">${escHtml(text)}</div>`;
    msgs.appendChild(el);
    scrollBottom();
  }

  // ─── Dispatch to variant builders ────────────────────────────
  function startThinkingSequence(sc) {
    if      (currentVariant === 'a') startPillStream(sc);
    else if (currentVariant === 'b') startActivityLog(sc);
    else if (currentVariant === 'c') startGhostCards(sc);
    else if (currentVariant === 'd') startStatusLine(sc);
    else if (currentVariant === 'e') startTimelineRail(sc);
    else if (currentVariant === 'f') startSourceChips(sc);
    else if (currentVariant === 'g') startReceiptCard(sc);
  }

  // ════════════════════════════════════
  // VARIANT A — Pill Stream
  // ════════════════════════════════════
  function startPillStream(sc) {
    const msgs = document.getElementById('chat-messages');

    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    const streamWrap = document.createElement('div');
    streamWrap.className = 'ts-pill-stream';
    aiRow.appendChild(streamWrap);
    scrollBottom();

    let i = 0;
    function nextPill() {
      if (i >= sc.steps.length) {
        // All done — collapse to summary
        streamWrap.innerHTML = '';
        const summary = makePill('summary', '✓', `${sc.steps.length} steps · ${totalDur(sc.steps)}`, false);
        streamWrap.appendChild(summary);
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 300);
        return;
      }

      const step = sc.steps[i];

      // Mark previous as done (show just checkmark)
      if (i > 0) {
        const prev = streamWrap.querySelectorAll('.ts-pill')[i - 1];
        if (prev) {
          prev.classList.remove('active');
          prev.classList.add('done');
          prev.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="hsl(142 70% 40%)" stroke-width="2.5" stroke-linecap="round" style="width:12px;height:12px"><path d="M20 6 9 17l-5-5"/></svg>`;
        }
      }

      const pill = makePill('active', step.icon, step.label, true);
      streamWrap.appendChild(pill);
      scrollBottom();
      i++;

      const delay = step.dur ? parseFloat(step.dur) * 800 + 400 : 1600;
      setTimeout(nextPill, delay);
    }
    nextPill();
  }

  function makePill(cls, icon, label, showLabel) {
    const el = document.createElement('div');
    el.className = `ts-pill ${cls}`;
    el.innerHTML = `<span class="ts-pill-icon" style="font-size:13px;${cls==='active'?'display:inline-block':''}">${icon}</span>${showLabel ? `<span class="ts-pill-label">${label}</span>` : ''}`;
    return el;
  }

  // ════════════════════════════════════
  // VARIANT B — Activity Log
  // ════════════════════════════════════
  function startActivityLog(sc) {
    const msgs = document.getElementById('chat-messages');

    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    // Build the log scaffold (all steps shown upfront as pending)
    const logWrap = document.createElement('div');
    logWrap.className = 'ts-log-wrap';

    const toggle = document.createElement('button');
    toggle.className = 'ts-log-toggle open';
    toggle.id = 'ts-log-toggle';
    toggle.innerHTML = `
      <div class="ts-log-toggle-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <span id="ts-log-summary">Working…</span>`;
    toggle.onclick = () => {
      toggle.classList.toggle('open');
      body.classList.toggle('open');
    };

    const body = document.createElement('div');
    body.className = 'ts-log-body open';
    body.id = 'ts-log-body';

    const inner = document.createElement('div');
    inner.className = 'ts-log-inner';

    sc.steps.forEach((step, idx) => {
      const row = document.createElement('div');
      row.className = 'ts-step';
      row.id = `ts-step-${idx}`;
      row.innerHTML = stepRow(step, idx === 0 ? 'active' : 'pending', idx);
      inner.appendChild(row);

      const detail = document.createElement('div');
      detail.className = 'ts-step-detail';
      detail.id = `ts-step-detail-${idx}`;
      detail.innerHTML = `<div class="ts-step-detail-inner">${step.detail.replace(/\n/g,'<br>')}</div>`;
      inner.appendChild(detail);
    });

    body.appendChild(inner);
    logWrap.appendChild(toggle);
    logWrap.appendChild(body);
    aiRow.appendChild(logWrap);
    scrollBottom();

    // Animate steps
    let i = 0;
    function activateStep() {
      if (i >= sc.steps.length) {
        // Done
        const summaryEl = document.getElementById('ts-log-summary');
        if (summaryEl) summaryEl.textContent = `Done in ${totalDur(sc.steps)} — ${sc.steps.length} steps`;
        // Auto-collapse after short pause
        setTimeout(() => {
          toggle.classList.remove('open');
          body.classList.remove('open');
        }, 800);
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 1200);
        return;
      }
      // Mark previous done
      if (i > 0) {
        const prev = document.getElementById(`ts-step-${i-1}`);
        if (prev) {
          prev.classList.remove('active');
          prev.innerHTML = stepRow(sc.steps[i-1], 'done', i-1);
        }
      }
      // Activate current
      const cur = document.getElementById(`ts-step-${i}`);
      if (cur) {
        cur.classList.add('active');
        cur.innerHTML = stepRow(sc.steps[i], 'active', i);
      }
      scrollBottom();
      i++;
      const delay = sc.steps[i-1].dur ? parseFloat(sc.steps[i-1].dur) * 900 + 500 : 1600;
      setTimeout(activateStep, delay);
    }
    activateStep();
  }

  function stepRow(step, state, idx) {
    let statusHtml = '';
    if (state === 'done') statusHtml = `<div class="ts-step-status ts-step-status-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></div>`;
    else if (state === 'active') statusHtml = `<div class="ts-step-status"><div class="ts-step-status-spin"></div></div>`;
    else statusHtml = `<div class="ts-step-status"><div class="ts-step-status-pending"></div></div>`;
    const dur = step.dur ? `<span class="ts-step-dur">${step.dur}</span>` : '';
    const expBtn = `<span class="ts-step-expand" onclick="toggleStepDetail(${idx})">details</span>`;
    return `
      ${statusHtml}
      <span class="ts-step-icon">${step.icon}</span>
      <span class="ts-step-label">${step.label}</span>
      ${dur}
      ${expBtn}`;
  }

  function toggleStepDetail(idx) {
    const el = document.getElementById(`ts-step-detail-${idx}`);
    if (el) el.classList.toggle('open');
  }

  // ════════════════════════════════════
  // VARIANT C — Ghost Cards
  // ════════════════════════════════════
  function startGhostCards(sc) {
    const msgs = document.getElementById('chat-messages');

    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    const ghostWrap = document.createElement('div');
    ghostWrap.className = 'ts-ghost';
    aiRow.appendChild(ghostWrap);

    let i = 0;
    function addCard() {
      if (i >= sc.steps.length) {
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 400);
        return;
      }
      const step = sc.steps[i];
      const card = makeGhostCard(step, i);
      ghostWrap.appendChild(card.card);
      ghostWrap.appendChild(card.detail);
      scrollBottom();
      i++;
      const delay = step.dur ? parseFloat(step.dur) * 800 + 300 : 1400;
      setTimeout(addCard, delay);
    }
    addCard();
  }

  function makeGhostCard(step, idx) {
    const methodCls = step.method === 'GET' ? 'get' : step.method === 'POST' ? 'post' : 'tool';
    const dur = step.dur ? `<span class="ts-ghost-card-dur">${step.dur}</span>` : `<span class="ts-ghost-card-dur" style="color:var(--brand-purple)">running…</span>`;

    const card = document.createElement('div');
    card.className = 'ts-ghost-card animate-in';
    card.id = `ghost-card-${idx}`;
    card.innerHTML = `
      <span class="ts-ghost-card-icon">${step.icon}</span>
      <span class="ts-ghost-card-label">${step.label}</span>
      ${dur}
      <span class="ts-ghost-card-method ${methodCls}">${step.method}</span>
      <svg class="ts-ghost-card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>`;
    card.onclick = () => toggleGhost(idx);

    const detail = document.createElement('div');
    detail.className = 'ts-ghost-detail';
    detail.id = `ghost-detail-${idx}`;
    detail.innerHTML = `
      <div class="ts-ghost-detail-inner">
        <div class="ts-ghost-io-row">
          <div class="ts-ghost-io-label">Input / Query</div>
          <div class="ts-ghost-io-val">${step.detail.split('\n')[0]}</div>
        </div>
        <div class="ts-ghost-io-row">
          <div class="ts-ghost-io-label">Result</div>
          <div class="ts-ghost-io-val">${step.detail.split('\n').slice(1).join('<br>') || '—'}</div>
        </div>
      </div>`;

    return { card, detail };
  }

  function toggleGhost(idx) {
    const card = document.getElementById(`ghost-card-${idx}`);
    const detail = document.getElementById(`ghost-detail-${idx}`);
    if (!card || !detail) return;
    const open = detail.classList.toggle('open');
    card.classList.toggle('expanded', open);
  }

  // ════════════════════════════════════
  // VARIANT D — Morphing Status Line
  // ════════════════════════════════════
  function startStatusLine(sc) {
    const msgs = document.getElementById('chat-messages');
    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    const wrap = document.createElement('div');
    wrap.className = 'ts-status-line';
    const spinner = document.createElement('div');
    spinner.className = 'ts-status-spinner';
    const textEl = document.createElement('span');
    textEl.className = 'ts-status-text';
    wrap.appendChild(spinner);
    wrap.appendChild(textEl);
    aiRow.appendChild(wrap);
    scrollBottom();

    // Build log for later reveal
    const logWrap = document.createElement('div');
    logWrap.className = 'ts-status-log';
    const logInner = document.createElement('div');
    logInner.className = 'ts-status-log-inner';
    sc.steps.forEach(step => {
      const row = document.createElement('div');
      row.className = 'ts-status-log-row';
      row.innerHTML = `
        <svg class="ts-status-log-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span class="ts-status-log-icon">${step.icon}</span>
        <span class="ts-status-log-label">${step.label}</span>
        ${step.dur ? `<span class="ts-status-log-dur">${step.dur}</span>` : ''}`;
      logInner.appendChild(row);
    });
    logWrap.appendChild(logInner);
    aiRow.appendChild(logWrap);

    function morphText(newText, cb) {
      textEl.classList.add('fade');
      setTimeout(() => {
        textEl.textContent = newText;
        textEl.classList.remove('fade');
        if (cb) setTimeout(cb, 60);
      }, 180);
    }

    let i = 0;
    function runStep() {
      if (i >= sc.steps.length) {
        // Done — swap spinner + text for "Done" button
        spinner.style.display = 'none';
        textEl.style.display = 'none';
        const doneBtn = document.createElement('button');
        doneBtn.className = 'ts-status-done';
        doneBtn.innerHTML = `
          <div class="ts-status-done-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          Done in ${totalDur(sc.steps)} · ${sc.steps.length} steps ›`;
        doneBtn.onclick = () => logWrap.classList.toggle('open');
        wrap.appendChild(doneBtn);
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 350);
        return;
      }
      const step = sc.steps[i];
      morphText(step.label + '…', () => { scrollBottom(); });
      i++;
      const delay = step.dur ? parseFloat(step.dur) * 900 + 400 : 1500;
      setTimeout(runStep, delay);
    }
    morphText(sc.steps[0].label + '…');
    i = 1;
    const firstDelay = sc.steps[0].dur ? parseFloat(sc.steps[0].dur) * 900 + 400 : 1500;
    setTimeout(runStep, firstDelay);
  }


  // ════════════════════════════════════
  // VARIANT E — Timeline Rail
  // ════════════════════════════════════
  function startTimelineRail(sc) {
    const msgs = document.getElementById('chat-messages');
    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    const rail = document.createElement('div');
    rail.className = 'ts-rail';

    // Track column (dots + lines)
    const track = document.createElement('div');
    track.className = 'ts-rail-track';
    sc.steps.forEach((step, idx) => {
      const dot = document.createElement('div');
      dot.className = 'ts-rail-dot' + (idx === 0 ? ' active' : '');
      dot.id = `rail-dot-${idx}`;
      track.appendChild(dot);
      if (idx < sc.steps.length - 1) {
        const line = document.createElement('div');
        line.className = 'ts-rail-line';
        line.id = `rail-line-${idx}`;
        track.appendChild(line);
      }
    });

    // Steps column
    const stepsCol = document.createElement('div');
    stepsCol.className = 'ts-rail-steps';
    sc.steps.forEach((step, idx) => {
      const s = document.createElement('div');
      s.className = 'ts-rail-step' + (idx === 0 ? ' active' : '');
      s.id = `rail-step-${idx}`;
      s.innerHTML = `
        <span class="ts-rail-step-icon">${step.icon}</span>
        <span class="ts-rail-step-text">${step.label}</span>
        ${step.dur ? `<span class="ts-rail-step-dur">${step.dur}</span>` : '<span class="ts-rail-step-dur" style="color:var(--brand-purple)">…</span>'}`;
      stepsCol.appendChild(s);
    });

    rail.appendChild(track);
    rail.appendChild(stepsCol);
    aiRow.appendChild(rail);
    scrollBottom();

    let i = 0;
    function advance() {
      if (i >= sc.steps.length) {
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 400);
        return;
      }
      // Mark previous done
      if (i > 0) {
        const prevDot = document.getElementById(`rail-dot-${i-1}`);
        const prevLine = document.getElementById(`rail-line-${i-1}`);
        const prevStep = document.getElementById(`rail-step-${i-1}`);
        if (prevDot) { prevDot.classList.remove('active'); prevDot.classList.add('done'); }
        if (prevLine) prevLine.classList.add('done');
        if (prevStep) { prevStep.classList.remove('active'); prevStep.classList.add('done'); }
      }
      // Activate current
      const dot = document.getElementById(`rail-dot-${i}`);
      const step = document.getElementById(`rail-step-${i}`);
      if (dot) dot.classList.add('active');
      if (step) step.classList.add('active');
      scrollBottom();
      i++;
      const delay = sc.steps[i-1].dur ? parseFloat(sc.steps[i-1].dur) * 900 + 400 : 1600;
      setTimeout(advance, delay);
    }
    advance();
  }


  // ════════════════════════════════════
  // VARIANT F — Source Chips
  // ════════════════════════════════════
  function startSourceChips(sc) {
    const msgs = document.getElementById('chat-messages');
    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    // Show a brief working indicator while steps run silently
    const workingEl = document.createElement('div');
    workingEl.className = 'ts-working-line';
    workingEl.innerHTML = `<div class="ts-working-spinner"></div> Researching…`;
    aiRow.appendChild(workingEl);
    scrollBottom();

    // Simulate all steps running, then reveal reply + chips
    const totalMs = sc.steps.reduce((a, s) => a + (s.dur ? parseFloat(s.dur) * 900 + 300 : 1400), 0);
    setTimeout(() => {
      // Remove working indicator
      workingEl.remove();

      // Build reply with inline [n] markers
      let replyHtml = mdLite(sc.reply);
      // Inject refs naturally at end of first sentence and after key facts
      const refCount = Math.min(sc.steps.length, 3);
      // Append refs inline at end of reply content naturally
      const sentences = replyHtml.split('. ');
      for (let r = 0; r < refCount && r < sentences.length; r++) {
        sentences[r] += ` <a class="ts-ref-tag" onclick="toggleSource(${r})" href="#">${r+1}</a>`;
      }
      replyHtml = sentences.join('. ');

      const replyEl = document.createElement('div');
      replyEl.className = 'ts-reply-with-refs animate-in';
      replyEl.innerHTML = replyHtml;
      aiRow.appendChild(replyEl);

      // Build source chips
      const sourcesWrap = document.createElement('div');
      sourcesWrap.id = 'ts-sources-wrap';

      const chipsRow = document.createElement('div');
      chipsRow.className = 'ts-sources-row';

      sc.steps.forEach((step, idx) => {
        const chip = document.createElement('div');
        chip.className = 'ts-source-chip';
        chip.id = `source-chip-${idx}`;
        chip.innerHTML = `<span class="ts-source-num">${idx+1}</span>${step.icon} ${step.label.length > 32 ? step.label.slice(0,32) + '…' : step.label}`;
        chip.onclick = () => toggleSource(idx);
        chipsRow.appendChild(chip);

        const detail = document.createElement('div');
        detail.className = 'ts-source-detail';
        detail.id = `source-detail-${idx}`;
        detail.innerHTML = `<div class="ts-source-detail-inner">${step.detail.replace(/\n/g,'<br>')}</div>`;
        chipsRow.appendChild(detail);
      });

      sourcesWrap.appendChild(chipsRow);
      aiRow.appendChild(sourcesWrap);
      scrollBottom();
    }, Math.min(totalMs, 3200));
  }

  function toggleSource(idx) {
    const chip = document.getElementById(`source-chip-${idx}`);
    const detail = document.getElementById(`source-detail-${idx}`);
    if (!chip || !detail) return;
    const open = detail.classList.toggle('open');
    chip.classList.toggle('expanded', open);
  }


  // ════════════════════════════════════
  // VARIANT G — Receipt Card
  // ════════════════════════════════════
  function startReceiptCard(sc) {
    const msgs = document.getElementById('chat-messages');
    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    const receipt = document.createElement('div');
    receipt.className = 'ts-receipt';

    const header = document.createElement('div');
    header.className = 'ts-receipt-header';
    header.id = 'ts-receipt-header';
    header.innerHTML = `
      <div class="ts-receipt-icon-spin" id="ts-receipt-spin"></div>
      <span class="ts-receipt-label" id="ts-receipt-label">Working…</span>`;

    const body = document.createElement('div');
    body.className = 'ts-receipt-body';
    body.id = 'ts-receipt-body';
    const bodyInner = document.createElement('div');
    bodyInner.className = 'ts-receipt-body-inner';
    sc.steps.forEach(step => {
      const row = document.createElement('div');
      row.className = 'ts-receipt-step';
      row.innerHTML = `
        <svg class="ts-receipt-step-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span class="ts-receipt-step-icon">${step.icon}</span>
        <span class="ts-receipt-step-label">${step.label}</span>
        ${step.dur ? `<span class="ts-receipt-step-dur">${step.dur}</span>` : ''}`;
      bodyInner.appendChild(row);
    });
    body.appendChild(bodyInner);
    receipt.appendChild(header);
    receipt.appendChild(body);
    aiRow.appendChild(receipt);
    scrollBottom();

    const totalMs = sc.steps.reduce((a, s) => a + (s.dur ? parseFloat(s.dur) * 900 + 300 : 1400), 0);
    setTimeout(() => {
      // Replace spinner with icon, update label, wire up toggle
      const spin = document.getElementById('ts-receipt-spin');
      if (spin) {
        spin.outerHTML = `<div class="ts-receipt-icon" id="ts-receipt-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        </div>`;
      }
      const labelEl = document.getElementById('ts-receipt-label');
      if (labelEl) labelEl.innerHTML = `<strong>${sc.steps.length} steps completed</strong> <span class="ts-receipt-meta">· ${totalDur(sc.steps)}</span>`;

      const hdr = document.getElementById('ts-receipt-header');
      if (hdr) {
        hdr.innerHTML += `<svg class="ts-receipt-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>`;
        hdr.onclick = () => {
          hdr.classList.toggle('expanded');
          body.classList.toggle('open');
        };
      }

      setTimeout(() => {
        const msgBubble = document.createElement('div');
        msgBubble.className = 'msg-bubble ai animate-in';
        msgBubble.innerHTML = mdLite(sc.reply);
        aiRow.appendChild(msgBubble);
        scrollBottom();
      }, 350);
    }, Math.min(totalMs, 3200));
  }


  // ─── Shared helpers ───────────────────────────────────────────
  function badge() {
    return `<div class="ai-badge">
      <div class="ai-badge-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6Z"/></svg></div>
      Nexos AI · GPT-4o
    </div>`;
  }

  function totalDur(steps) {
    const sum = steps.reduce((acc, s) => acc + (s.dur ? parseFloat(s.dur) : 0), 0);
    return sum.toFixed(1) + 's';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function mdLite(s) {
    return s
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }

  function scrollBottom() {
    const t = document.getElementById('chat-thread');
    requestAnimationFrame(() => { t.scrollTop = t.scrollHeight; });
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
  }

  function sendPrompt() {
    const input = document.getElementById('prompt-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    clearMessages();
    addUserMsg(text);
    const sc = {
      query: text,
      steps: SCENARIOS[currentScenario].steps,
      reply: SCENARIOS[currentScenario].reply
    };
    setTimeout(() => startThinkingSequence(sc), 600);
  }

  function toggleVersions() {
    document.getElementById('version-switcher').classList.toggle('open');
  }

  // ─── Init — run default scenario ─────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    runScenarioAuto();
  });
</script>
</body>
