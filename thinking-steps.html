  function startTerminal(sc) {
    const msgs = document.getElementById('chat-messages');
    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    const termWrap = document.createElement('div');
    termWrap.className = 'ts-terminal-wrap';

    const toggle = document.createElement('button');
    toggle.className = 'ts-terminal-toggle open';
    toggle.innerHTML = `<div class="ts-terminal-toggle-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></div><span id="ts-term-summary">Running…</span>`;

    const bodyWrap = document.createElement('div');
    bodyWrap.className = 'ts-terminal-body open';

    const block = document.createElement('div');
    block.className = 'ts-terminal-block';
    block.id = 'ts-term-block';

    bodyWrap.appendChild(block);
    termWrap.appendChild(toggle);
    termWrap.appendChild(bodyWrap);
    aiRow.appendChild(termWrap);

    toggle.onclick = () => { toggle.classList.toggle('open'); bodyWrap.classList.toggle('open'); };

    let elapsed = 0;
    let i = 0;

    function addLine() {
      if (i >= sc.steps.length) {
        const cursorEl = block.querySelector('.ts-terminal-cursor');
        if (cursorEl) cursorEl.remove();
        document.getElementById('ts-term-summary').textContent = `Done · ${sc.steps.length} commands · ${totalDur(sc.steps)}`;
        setTimeout(() => { toggle.classList.remove('open'); bodyWrap.classList.remove('open'); }, 600);
        setTimeout(() => {
          const msgBubble = document.createElement('div');
          msgBubble.className = 'msg-bubble ai animate-in';
          msgBubble.innerHTML = mdLite(sc.reply);
          aiRow.appendChild(msgBubble);
          scrollBottom();
        }, 1000);
        return;
      }
      const step = sc.steps[i];
      const ts = elapsed.toFixed(1).padStart(5, '0');
      elapsed += step.dur ? parseFloat(step.dur) : 1.0;

      // Command line
      const cmdLine = document.createElement('div');
      cmdLine.className = 'ts-terminal-line';
      cmdLine.innerHTML = `<span class="ts-terminal-ts">[${ts}]</span><span class="ts-terminal-cmd">› ${step.label}</span>`;
      block.appendChild(cmdLine);

      const delay = step.dur ? parseFloat(step.dur) * 900 + 400 : 1400;
      setTimeout(() => {
        // Result line
        const resLine = document.createElement('div');
        resLine.className = 'ts-terminal-line';
        const resultText = step.detail.split('\n')[1] || step.detail.split('\n')[0];
        resLine.innerHTML = `<span class="ts-terminal-ts">      </span><span class="ts-terminal-ok">✓</span> <span class="ts-terminal-val">${resultText}</span>`;
        block.appendChild(resLine);
        block.scrollTop = block.scrollHeight;
        scrollBottom();
        i++;
        addLine();
      }, delay);

      // Cursor
      const existing = block.querySelector('.ts-terminal-cursor');
      if (existing) existing.remove();
      const cur = document.createElement('span');
      cur.className = 'ts-terminal-cursor';
      block.appendChild(cur);
      block.scrollTop = block.scrollHeight;
      scrollBottom();
    }
    addLine();
  }

  function startSkeletonReveal(sc) {
    const msgs = document.getElementById('chat-messages');
    const aiRow = document.createElement('div');
    aiRow.className = 'msg-row ai animate-in';
    aiRow.innerHTML = badge();
    msgs.appendChild(aiRow);

    // Split reply into as many sections as steps
    const replyParts = splitIntoParts(sc.reply, sc.steps.length);

    const skelWrap = document.createElement('div');
    skelWrap.className = 'ts-skeleton-wrap';

    replyParts.forEach((_, idx) => {
      const section = document.createElement('div');
      section.className = 'ts-skel-section-wrap';
      section.id = `skel-section-${idx}`;

      const skel = document.createElement('div');
      skel.className = 'ts-skel-section';
      skel.innerHTML = `
        <div class="ts-skel-line w-full"></div>
        <div class="ts-skel-line ${idx % 2 === 0 ? 'w-80' : 'w-60'}"></div>
        ${idx < 1 ? '<div class="ts-skel-line w-40"></div>' : ''}`;
      section.appendChild(skel);
      skelWrap.appendChild(section);
    });

    aiRow.appendChild(skelWrap);
    scrollBottom();

    let i = 0;
    function revealSection() {
      if (i >= replyParts.length) return;
      const section = document.getElementById(`skel-section-${i}`);
      if (section) {
        section.innerHTML = '';
        const reveal = document.createElement('div');
        reveal.className = 'ts-skel-reveal';
        reveal.innerHTML = mdLite(replyParts[i]);
        section.appendChild(reveal);
      }
      i++;
      if (i >= replyParts.length) {
        scrollBottom();
        return;
      }
      const delay = sc.steps[i-1] ? (sc.steps[i-1].dur ? parseFloat(sc.steps[i-1].dur) * 900 + 400 : 1400) : 800;
      setTimeout(revealSection, delay);
      scrollBottom();
    }
    const firstDelay = sc.steps[0].dur ? parseFloat(sc.steps[0].dur) * 900 + 400 : 1400;
    setTimeout(revealSection, firstDelay);
  }

  function splitIntoParts(text, n) {
    const sentences = text.split(/(?<=\.)\s+|(?<=\n)/);
    if (n <= 1 || sentences.length <= 1) return [text];
    const perPart = Math.ceil(sentences.length / n);
    const parts = [];
    for (let i = 0; i < n; i++) {
      const chunk = sentences.slice(i * perPart, (i + 1) * perPart).join(' ');
      if (chunk.trim()) parts.push(chunk.trim());
    }
    return parts.length ? parts : [text];
  }

  function totalDur(steps) {
    const sum = steps.reduce((acc, s) => acc + (s.dur ? parseFloat(s.dur) : 0), 0);
    return sum.toFixed(1) + 's';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function mdLite(s) {
    return s
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }

  function scrollBottom() {
    const t = document.getElementById('chat-thread');
    requestAnimationFrame(() => { t.scrollTop = t.scrollHeight; });
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
  }

  function sendPrompt() {
    const input = document.getElementById('prompt-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    clearMessages();
    addUserMsg(text);
    const sc = {
      query: text,
      steps: SCENARIOS[currentScenario].steps,
      reply: SCENARIOS[currentScenario].reply
    };
    setTimeout(() => startThinkingSequence(sc), 600);
  }

  function toggleVersions() {
    document.getElementById('version-switcher').classList.toggle('open');
  }

  // ─── Init — run default scenario ─────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    runScenarioAuto();
  });
</script>
</body>
</html>
